<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Quel âge ai-je ? Calculateur d'âge précis | Simulateur</title><meta name="description" content="Calculez précisément votre âge en années, mois et jours à partir de votre date de naissance."><link rel="canonical" href="https://simulateur.site/outil/age/"><link rel="stylesheet" href="/styles.css"><script src="/simulateurs.js" defer></script><script src="/enter-calcul.js" defer></script></head><body><main><div class="wrap"><div class="tool"><div class="eyebrow" id="ey">ÂGE</div><h1 id="title">Quel âge ai-je ?</h1><p id="intro">Indiquez votre date de naissance pour connaître votre âge exact aujourd’hui.</p><div id="fields"><div class="field"><label for="dob">Date de naissance</label><input id="dob" type="date"></div><div class="field"><label for="now">Calculer au</label><input id="now" type="date"></div></div><button class="button-main" onclick="Simulateurs.calc()">Calculer</button><div class="result" id="result"></div><div class="formula"><p id="source">L’âge est calculé en tenant compte du passage réel des mois et du jour d’anniversaire, et non par une simple division du nombre de jours par 365.</p></div></div></div></main><script>window.TOOL={ey:"ÂGE",title:"Quel âge ai-je ?",intro:"Indiquez votre date de naissance pour connaître votre âge exact aujourd’hui.",fields:function(){},calc:function(){const d=this.$("dob").value,n=this.$("now").value;if(!d||!n)return"Veuillez renseigner les deux dates.";const b=new Date(d+"T00:00:00Z"),t=new Date(n+"T00:00:00Z");if(isNaN(b)||isNaN(t)||b>t)return"Dates invalides : la date de naissance doit être antérieure ou égale à la date de calcul.";let y=t.getUTCFullYear()-b.getUTCFullYear(),m=t.getUTCMonth()-b.getUTCMonth(),day=t.getUTCDate()-b.getUTCDate();if(day<0){m--;const last=new Date(Date.UTC(t.getUTCFullYear(),t.getUTCMonth(),0)).getUTCDate();day+=last}if(m<0){y--;m+=12}return"<strong>"+y+" an"+(y>1?"s":"")+"</strong>"+(m||day?"<br><span>"+m+" mois et "+day+" jour"+(day>1?"s":"")+"</span>":"")},source:"Calcul calendaire : années, mois et jours sont déterminés à partir des dates civiles saisies."};window.addEventListener("DOMContentLoaded",()=>{const now=new Date();const iso=d=>d.toISOString().slice(0,10);const el=document.getElementById("now");if(el)el.value=iso(now);Simulateurs.render();});</script></body></html>
