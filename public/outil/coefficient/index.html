<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Calculateur de coefficient multiplicateur et d’évolution | Simulateur</title><meta name="description" content="Calculez le coefficient entre une valeur initiale et une valeur finale, puis retrouvez directement le taux d’évolution en pourcentage."><link rel="canonical" href="https://simulateur.site/outil/coefficient/"><link rel="stylesheet" href="/styles.css"><script src="/simulateurs.js" defer></script><script src="/enter-calcul.js" defer></script><script type="application/ld+json">{"@context":"https://schema.org","@type":"WebApplication","name":"Calculateur de coefficient","url":"https://simulateur.site/outil/coefficient/","applicationCategory":"UtilitiesApplication","operatingSystem":"Any","description":"Calculer un coefficient entre une valeur initiale et une valeur finale, ainsi que le taux d’évolution correspondant.","offers":{"@type":"Offer","price":"0","priceCurrency":"EUR"}}</script><script type="application/ld+json">{"@context":"https://schema.org","@type":"BreadcrumbList","itemListElement":[{"@type":"ListItem","position":1,"name":"Accueil","item":"https://simulateur.site/"},{"@type":"ListItem","position":2,"name":"Coefficient","item":"https://simulateur.site/outil/coefficient/"}]}</script></head><body><main><div class="wrap"><div class="tool"><div class="eyebrow" id="ey">MATHÉMATIQUES</div><h1 id="title">Coefficient</h1><p id="intro">Calculez le coefficient entre deux valeurs.</p><div id="fields"><div class="field"><label for="a">Valeur initiale</label><input id="a" type="number" value="100"></div><div class="field"><label for="b">Valeur finale</label><input id="b" type="number" value="125"></div></div><button class="button-main" onclick="Simulateurs.calc()">Calculer</button><div class="result" id="result"></div><div class="formula"><p id="source">Calculez le coefficient entre deux valeurs.</p></div></div></div></main><script>window.TOOL={ey:"MATHÉMATIQUES",title:"Calculateur de coefficient",intro:"Calculez le coefficient entre une valeur initiale et une valeur finale, puis obtenez automatiquement la variation en pourcentage.",fields:function(){},calc:function(){const a=Number(this.$("a").value),b=Number(this.$("b").value);if(!Number.isFinite(a)||!Number.isFinite(b)||a===0)return'<div class="status-note" role="alert"><strong>Valeurs invalides.</strong><p>La valeur initiale doit être différente de zéro et les deux valeurs doivent être numériques.</p></div>';const c=b/a,v=(c-1)*100,fn=x=>x.toLocaleString("fr-FR",{maximumFractionDigits:4}),fp=x=>x.toLocaleString("fr-FR",{maximumFractionDigits:2,signDisplay:"always"})+" %";return'<div class="result-main"><strong>Coefficient : '+fn(c)+'</strong><p>Variation : '+fp(v)+'</p></div>'},source:"Coefficient = valeur finale ÷ valeur initiale. Taux d'évolution = (coefficient − 1) × 100."};window.addEventListener("DOMContentLoaded",()=>Simulateurs.render());</script></body></html>
