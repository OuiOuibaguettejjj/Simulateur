<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Prix unitaire | Simulateur</title><meta name="description" content="Calculez le prix par kg, litre ou unité."><link rel="canonical" href="https://simulateur.site/outil/prix-unitaire/"><link rel="stylesheet" href="/styles.css"><script src="/simulateurs.js" defer></script><script src="/enter-calcul.js" defer></script></head><body><main><div class="wrap"><div class="tool"><div class="eyebrow" id="ey">Prix unitaire</div><h1 id="title">Prix unitaire</h1><p id="intro">Calculez le prix par kg, litre ou unité.</p><div id="fields"><div class="field"><label for="p">Prix (€)</label><input id="p" type="number" value="10"></div><div class="field"><label for="q">Quantité</label><input id="q" type="number" value="2"></div><div class="field"><label for="u">Unité</label><input id="u" value="kg"></div></div><button class="button-main" onclick="Simulateurs.calc()">Calculer</button><div class="result" id="result"></div><div class="formula"><p id="source">Calculez le prix par kg, litre ou unité.</p></div></div></div></main><script>window.TOOL={ey:"Prix unitaire",title:"Prix unitaire",intro:"Calculez le prix par kg, litre ou unité.",fields:function(){},calc:function(){const p=+this.$("p").value,q=+this.$("q").value,u=this.$("u").value;if(p<0||q<=0)return"Valeurs invalides.";return"<strong>"+this.euro(p/q)+" / "+u+"</strong>"},source:"Calculez le prix par kg, litre ou unité."};window.addEventListener("DOMContentLoaded",()=>Simulateurs.render());</script></body></html>
