<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SASU, EI ou micro | Simulateur</title><meta name="description" content="Comparaison pédagogique de trois structures."><link rel="canonical" href="https://simulateur.site/outil/sasu-vs-ei-micro/"><link rel="stylesheet" href="/styles.css"><script src="/simulateurs.js" defer></script><script src="/enter-calcul.js" defer></script></head><body><main><div class="wrap"><div class="tool"><div class="eyebrow" id="ey">ENTREPRENEURIAT</div><h1 id="title">SASU, EI ou micro</h1><p id="intro">Comparaison pédagogique de trois structures.</p><div id="fields"><div class="field"><label for="ca">Chiffre d'affaires (€)</label><input id="ca" type="number" value="50000"></div><div class="field"><label for="s">Structure</label><select id="s"><option>Micro</option><option>EI</option><option>SASU</option></select></div></div><button class="button-main" onclick="Simulateurs.calc()">Calculer</button><div class="result" id="result"></div><div class="formula"><p id="source">Comparaison pédagogique de trois structures.</p></div></div></div></main><script>window.TOOL={ey:"ENTREPRENEURIAT",title:"SASU, EI ou micro",intro:"Comparaison pédagogique de trois structures.",fields:function(){},calc:function(){const ca=+this.$("ca").value,s=this.$("s").value;if(ca<0)return"Valeur invalide.";if(s==="Micro")return `<strong>La micro-entreprise applique des cotisations sociales calculées sur le chiffre d’affaires, selon la nature de l’activité.</strong><br><br>À titre d’exemple, le taux 2026 est de 12,3 % en vente, 21,2 % en prestations BIC, 25,6 % en BNC non réglementé et 23,2 % pour la Cipav.<p class="small">Le calculateur ne donne pas de montant pour l’EI ou la SASU à partir du seul chiffre d’affaires : les cotisations dépendent notamment du bénéfice ou de la rémunération. Utiliser un pourcentage fixe du CA serait trompeur.</p>`;return `<strong>${s} : le chiffre d’affaires seul ne permet pas de calculer correctement les cotisations.</strong><br><br>Il faut notamment connaître les charges de l’entreprise et, pour une SASU, la rémunération versée au dirigeant.<p class="small">Comparaison pédagogique, non substitutive aux simulateurs Urssaf.</p>`},source:"Comparaison pédagogique de trois structures."};window.addEventListener("DOMContentLoaded",()=>Simulateurs.render());</script></body></html>
