<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Calculateur d'arrondi | Simulateur</title><meta name="description" content="Arrondissez un nombre au nombre de décimales souhaité."><link rel="canonical" href="https://simulateur.site/outil/arrondi/"><link rel="stylesheet" href="/styles.css"><script src="/simulateurs.js" defer></script><script src="/enter-calcul.js" defer></script></head><body><main><div class="wrap"><div class="tool"><div class="eyebrow" id="ey">MATHÉMATIQUES</div><h1 id="title">Calculateur d'arrondi</h1><p id="intro">Arrondissez un nombre au nombre de décimales souhaité.</p><div id="fields"><div class="field"><label for="v">Nombre</label><input id="v" type="number step="any" value="12.345"></div><div class="field"><label for="p">Décimales</label><input id="p" type="number" value="2"></div></div><button class="button-main" onclick="Simulateurs.calc()">Calculer</button><div class="result" id="result"></div><div class="formula"><p id="source">Calcul selon une formule mathématique standard.</p></div></div></div></main><script>window.TOOL={ey:"MATHÉMATIQUES",title:"Calculateur d'arrondi",intro:"Arrondissez un nombre au nombre de décimales souhaité.",fields:function(){},calc:function(){const v=+this.$("v").value,p=+this.$("p").value;if(!Number.isFinite(v)||p<0)return"Valeurs invalides.";return"<strong>"+v.toFixed(p)+"</strong>"},source:"Calcul selon une formule mathématique standard."};window.addEventListener("DOMContentLoaded",()=>Simulateurs.render());</script></body></html>
