<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Convertisseur Celsius Fahrenheit Kelvin — Simulateur</title><meta name="description" content="Convertissez degrés Celsius, Fahrenheit et Kelvin avec le convertisseur de température Simulateur."><link rel="canonical" href="https://simulateur.site/conversion/temperature/"><link rel="stylesheet" href="/styles.css"></head><body><header><div class="wrap nav"><a class="logo" href="/">Simulateur<span>.</span></a><nav class="navlinks"><a href="/calculateurs/">Calculateurs</a><a href="/conversions/">Conversions</a><a href="/comparateurs/">Comparateurs</a></nav></div></header><main><div class="wrap"><div class="breadcrumb"><a href="/conversions/">Conversions</a> → Température</div><section class="tool"><div class="eyebrow">CONVERSION</div><h1>Convertisseur de température</h1><p class="tool-intro">Saisissez une température en degrés Celsius.</p><div class="field"><label>°C</label><input id="v" type="number" step="any" placeholder="20"></div><button class="button-main" onclick="calc()">Convertir</button><div id="r" class="result" hidden></div><div class="formula"><strong>Formules</strong><p>°F = °C × 9/5 + 32 · K = °C + 273,15.</p></div></section></div></main><footer><div class="wrap"><a href="/mentions-legales/">Mentions légales</a> · <a href="/confidentialite/">Confidentialité</a></div></footer><script>function calc(){const x=Number(v.value);if(!Number.isFinite(x)||x<-273.15){r.hidden=false;r.textContent='Saisissez une température valide (au moins −273,15 °C).';return}r.hidden=false;r.innerHTML='<strong>'+x.toLocaleString('fr-FR')+' °C</strong><br>'+ (x*9/5+32).toLocaleString('fr-FR',{maximumFractionDigits:4})+' °F · '+(x+273.15).toLocaleString('fr-FR',{maximumFractionDigits:4})+' K'}</script></body></html>
