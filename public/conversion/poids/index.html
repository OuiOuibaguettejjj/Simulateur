<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Convertisseur de poids : g, kg, tonnes — Simulateur</title><meta name="description" content="Convertissez grammes, kilogrammes, milligrammes et tonnes gratuitement."><link rel="canonical" href="https://simulateur.site/conversion/poids/"><link rel="stylesheet" href="/styles.css"></head><body><header><div class="wrap nav"><a class="logo" href="/">Simulateur<span>.</span></a><nav class="navlinks"><a href="/calculateurs/">Calculateurs</a><a href="/conversions/">Conversions</a><a href="/comparateurs/">Comparateurs</a></nav></div></header><main><div class="wrap"><div class="breadcrumb"><a href="/conversions/">Conversions</a> → Poids</div><section class="tool"><div class="eyebrow">CONVERSION</div><h1>Convertisseur de poids</h1><p class="tool-intro">Entrez une valeur et obtenez les équivalences en mg, g, kg et tonnes.</p><div class="field"><label>Valeur en kilogrammes</label><input id="v" type="number" step="any" placeholder="1"></div><button class="button-main" onclick="calc()">Convertir</button><div id="r" class="result" hidden></div><div class="formula"><strong>Repères</strong><p>1 kg = 1 000 g = 1 000 000 mg = 0,001 tonne.</p></div></section></div></main><footer><div class="wrap"><a href="/mentions-legales/">Mentions légales</a> · <a href="/confidentialite/">Confidentialité</a></div></footer><script>function calc(){const x=Number(v.value);if(!Number.isFinite(x)||x<0){r.hidden=false;r.textContent='Saisissez une valeur valide.';return}r.hidden=false;r.innerHTML='<strong>'+(x*1000).toLocaleString('fr-FR')+' g</strong><br>'+(x*1e6).toLocaleString('fr-FR')+' mg · '+(x/1000).toLocaleString('fr-FR')+' tonne(s)'}</script></body></html>
