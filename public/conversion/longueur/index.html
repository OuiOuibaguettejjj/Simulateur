<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Convertisseur de longueur : mm, cm, m, km — Simulateur</title><meta name="description" content="Convertissez millimètres, centimètres, mètres et kilomètres avec Simulateur."><link rel="canonical" href="https://simulateur.site/conversion/longueur/"><link rel="stylesheet" href="/styles.css"></head><body><header><div class="wrap nav"><a class="logo" href="/">Simulateur<span>.</span></a><nav class="navlinks"><a href="/calculateurs/">Calculateurs</a><a href="/conversions/">Conversions</a><a href="/comparateurs/">Comparateurs</a></nav></div></header><main><div class="wrap"><div class="breadcrumb"><a href="/conversions/">Conversions</a> → Longueur</div><section class="tool"><div class="eyebrow">CONVERSION</div><h1>Convertisseur de longueur</h1><p class="tool-intro">Saisissez une longueur en mètres pour obtenir les principales équivalences.</p><div class="field"><label>Mètres</label><input id="v" type="number" step="any" placeholder="2.5"></div><button class="button-main" onclick="calc()">Convertir</button><div id="r" class="result" hidden></div><div class="formula"><strong>Repères</strong><p>1 m = 100 cm = 1 000 mm = 0,001 km.</p></div></section></div></main><footer><div class="wrap"><a href="/mentions-legales/">Mentions légales</a> · <a href="/confidentialite/">Confidentialité</a></div></footer><script>function calc(){const x=Number(v.value);if(!Number.isFinite(x)||x<0){r.hidden=false;r.textContent='Saisissez une valeur valide.';return}r.hidden=false;r.innerHTML='<strong>'+(x*100).toLocaleString('fr-FR')+' cm</strong><br>'+(x*1000).toLocaleString('fr-FR')+' mm · '+(x/1000).toLocaleString('fr-FR')+' km'}</script></body></html>
