<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Convertisseur de données : octets, Ko, Mo, Go, To | Simulateur</title><meta name="description" content="Convertissez octets, Ko, Mo, Go et To rapidement avec un convertisseur gratuit."><link rel="canonical" href="https://simulateur.site/conversion/donnees/"><link rel="icon" href="/favicon.svg" type="image/svg+xml"><link rel="stylesheet" href="/styles.css"></head><body><header><div class="wrap nav"><a class="logo" href="/">Simulateur<span>.</span></a><nav class="navlinks"><a href="/calculateurs/">Calculateurs</a><a href="/conversions/">Conversions</a><a href="/comparateurs/">Comparateurs</a></nav></div></header><main><div class="wrap"><section class="tool"><div class="eyebrow">CONVERSION</div><h1>Convertisseur de données</h1><p class="tool-intro">Convertissez octets, Ko, Mo, Go et To. Convention utilisée : 1 Ko = 1 024 octets.</p><div class="row"><div class="field"><label for="v">Valeur</label><input id="v" type="number" step="any" placeholder="1"></div><div class="field"><label for="from">De</label><select id="from"></select></div></div><div class="field"><label for="to">Vers</label><select id="to"></select></div><button class="button-main" id="go">Convertir</button><div class="result" id="r" aria-live="polite">—</div></section></div><section class="related-tools"><div><div class="eyebrow">CONVERSIONS</div><h2>Autres conversions</h2></div><div class="related-links"><a class="related-link" href="/conversion/poids/">Poids →</a><a class="related-link" href="/conversion/longueur/">Longueur →</a><a class="related-link" href="/conversion/volume/">Volume →</a><a class="related-link" href="/conversion/devises/">Devises →</a></div></section></main><footer><div class="wrap"><a href="/">Accueil</a></div></footer><script>const U={o:1,ko:1024,mo:1024**2,go:1024**3,to:1024**4},N={o:'octet',ko:'Ko',mo:'Mo',go:'Go',to:'To'};for(const id of ['from','to'])for(const k in U){const o=document.createElement('option');o.value=k;o.textContent=N[k];document.querySelector('#'+id).append(o)}from.value='go';to.value='mo';document.querySelector('#go').onclick=()=>{const x=Number(v.value);if(!Number.isFinite(x)||x<0){r.textContent='Saisissez une valeur valide.';return}r.innerHTML='<strong>'+(x*U[from.value]/U[to.value]).toLocaleString('fr-FR',{maximumFractionDigits:10})+' '+N[to.value]+'</strong>'}</script></body></html>
