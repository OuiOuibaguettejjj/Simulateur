<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Convertisseur d'aire : m², km², hectares, acres | Simulateur</title><meta name="description" content="Convertissez mm², cm², m², km², hectares et acres avec ce convertisseur d'aire gratuit."><link rel="canonical" href="https://simulateur.site/conversion/aire/"><link rel="icon" href="/favicon.svg" type="image/svg+xml"><link rel="stylesheet" href="/styles.css"></head><body><header><div class="wrap nav"><a class="logo" href="/">Simulateur<span>.</span></a><nav class="navlinks"><a href="/calculateurs/">Calculateurs</a><a href="/conversions/">Conversions</a><a href="/comparateurs/">Comparateurs</a></nav></div></header><main><div class="wrap"><section class="tool"><div class="eyebrow">CONVERSION</div><h1>Convertisseur d'aire</h1><p class="tool-intro">Convertissez facilement les surfaces entre mm², cm², m², km², hectares et acres.</p><div class="row"><div class="field"><label for="v">Valeur</label><input id="v" type="number" step="any" placeholder="100"></div><div class="field"><label for="from">De</label><select id="from"></select></div></div><div class="field"><label for="to">Vers</label><select id="to"></select></div><button class="button-main" id="go">Convertir</button><div class="result" id="r" aria-live="polite">—</div></section></div><section class="related-tools"><div><div class="eyebrow">MESURES</div><h2>Outils associés</h2></div><div class="related-links"><a class="related-link" href="/outil/surface/">Surface →</a><a class="related-link" href="/conversion/longueur/">Longueur →</a><a class="related-link" href="/outil/perimetre/">Périmètre →</a><a class="related-link" href="/conversion/poids/">Poids →</a></div></section></main><footer><div class="wrap"><a href="/">Accueil</a></div></footer><script>const U={mm2:1e-6,cm2:1e-4,m2:1,km2:1e6,ha:1e4,acre:4046.8564224},N={mm2:'mm²',cm2:'cm²',m2:'m²',km2:'km²',ha:'ha',acre:'acre'};for(const id of ['from','to'])for(const k in U){const o=document.createElement('option');o.value=k;o.textContent=N[k];document.querySelector('#'+id).append(o)}from.value='m2';to.value='ha';document.querySelector('#go').onclick=()=>{const x=Number(v.value);if(!Number.isFinite(x)||x<0){r.textContent='Saisissez une valeur valide.';return}r.innerHTML='<strong>'+(x*U[from.value]/U[to.value]).toLocaleString('fr-FR',{maximumFractionDigits:10})+' '+N[to.value]+'</strong>'}</script></body></html>
