<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Calculateur coût au kilomètre | Simulateur</title><meta name="description" content="Estimez le coût réel d'utilisation d'une voiture par kilomètre."><link rel="canonical" href="https://simulateur.site/outil/cout-km/"><link rel="stylesheet" href="/styles.css"><script src="/simulateurs.js" defer></script><script src="/enter-calcul.js" defer></script></head><body><header><div class="wrap nav"><a class="logo" href="/">Simulateur<span>.</span></a><nav class="navlinks"><a href="/calculateurs/">Calculateurs</a><a href="/simulateurs/">Simulateurs</a><a href="/conversions/">Conversions</a><a href="/comparateurs/">Comparateurs</a><a href="/a-propos/">À propos</a></nav></div></header><main><div class="wrap"><div class="breadcrumb"><a href="/calculateurs/">Calculateurs</a> · Calculateur coût au kilomètre</div><div class="tool"><div class="eyebrow" id="ey"></div><h1 id="title"></h1><p class="tool-intro" id="intro"></p><div id="fields"></div><button class="button-main" onclick="Simulateurs.calc()">Calculer</button><div class="result" id="result">Saisissez vos données puis lancez le calcul.</div><div class="formula"><strong>Méthode et sources</strong><p id="source"></p></div></div></div></main><footer><div class="wrap"><div class="footerlinks"><a href="/">Accueil</a><a href="/mentions-legales/">Mentions légales</a><a href="/confidentialite/">Confidentialité</a><a href="/cgu/">CGU</a></div></div></footer><script>const F={text:(i,l,p="",s="any")=>'<div class="field"><label for="'+i+'">'+l+'</label><input id="'+i+'" type="number" min="0" step="'+s+'" placeholder="'+p+'"></div>',select:(i,l,o)=>'<div class="field"><label for="'+i+'">'+l+'</label><select id="'+i+'">'+o.map(x=>'<option value="'+x[0]+'">'+x[1]+'</option>').join('')+'</select></div>',row:a=>'<div class="row">'+a.join('')+'</div>'};window.TOOL={ey:"AUTOMOBILE",title:"Calculateur coût au kilomètre",intro:"Estimez le coût réel d'utilisation d'une voiture par kilomètre.",fields:function(){return F.row([F.text("achat","Prix d'achat (€)","25000"),F.text("duree","Durée de détention (années)","5")])+F.row([F.text("km","Kilométrage annuel","12000"),F.text("carb","Carburant annuel (€)","1800")])+F.row([F.text("ent","Entretien annuel (€)","700"),F.text("ass","Assurance annuelle (€)","700")])+F.text("autres","Autres coûts annuels (€)","300")},calc:function(){const a=+this.$("achat").value||0,n=+this.$("duree").value||0,k=+this.$("km").value||0,c=+this.$("carb").value||0,e=+this.$("ent").value||0,s=+this.$("ass").value||0,o=+this.$("autres").value||0;if(n<=0||k<=0)return "Renseignez une durée et un kilométrage valides.";const total=a+c*n+e*n+s*n+o*n;return "<strong>"+this.euro(total/(k*n))+" / km</strong><br><br>Coût total sur "+n+" ans : "+this.euro(total)+"<br>Coût annuel moyen : "+this.euro(total/n)+"<p class='small'>Cette version ne déduit pas la valeur de revente : elle mesure les dépenses brutes engagées.</p>"},source:"Méthode de coût complet simplifié : prix d'acquisition + dépenses annuelles saisies, rapportés au kilométrage total. Les frais professionnels fiscaux utilisent des règles différentes ; le barème kilométrique officiel inclut plusieurs composantes."};window.addEventListener("DOMContentLoaded",()=>Simulateurs.render());</script></body></html>
