<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Calculateur jours ouvrés | Simulateur</title><meta name="description" content="Comptez les jours ouvrés entre deux dates, du lundi au vendredi, avec option jours fériés."><link rel="canonical" href="https://simulateur.site/outil/jours-ouvres/"><link rel="stylesheet" href="/styles.css"><script src="/simulateurs.js" defer></script><script src="/enter-calcul.js" defer></script></head><body><header><div class="wrap nav"><a class="logo" href="/">Simulateur<span>.</span></a><nav class="navlinks"><a href="/calculateurs/">Calculateurs</a><a href="/simulateurs/">Simulateurs</a><a href="/conversions/">Conversions</a><a href="/comparateurs/">Comparateurs</a><a href="/a-propos/">À propos</a></nav></div></header><main><div class="wrap"><div class="breadcrumb"><a href="/calculateurs/">Calculateurs</a> · Calculateur jours ouvrés</div><div class="tool"><div class="eyebrow" id="ey"></div><h1 id="title"></h1><p class="tool-intro" id="intro"></p><div id="fields"></div><button class="button-main" onclick="Simulateurs.calc()">Calculer</button><div class="result" id="result">Saisissez vos données puis lancez le calcul.</div><div class="formula"><strong>Méthode et sources</strong><p id="source"></p></div></div></div></main><footer><div class="wrap"><div class="footerlinks"><a href="/">Accueil</a><a href="/mentions-legales/">Mentions légales</a><a href="/confidentialite/">Confidentialité</a><a href="/cgu/">CGU</a></div></div></footer><script>const F={text:(i,l,p="",s="any")=>'<div class="field"><label for="'+i+'">'+l+'</label><input id="'+i+'" type="number" min="0" step="'+s+'" placeholder="'+p+'"></div>',select:(i,l,o)=>'<div class="field"><label for="'+i+'">'+l+'</label><select id="'+i+'">'+o.map(x=>'<option value="'+x[0]+'">'+x[1]+'</option>').join('')+'</select></div>',row:a=>'<div class="row">'+a.join('')+'</div>'};window.TOOL={ey:"TRAVAIL",title:"Calculateur jours ouvrés",intro:"Comptez les jours ouvrés entre deux dates, du lundi au vendredi, avec option jours fériés.",fields:function(){return F.row([F.text("j1","Jour début","1","1"),F.text("m1","Mois début","1","1"),F.text("a1","Année début","2026","1")])+F.row([F.text("j2","Jour fin","31","1"),F.text("m2","Mois fin","12","1"),F.text("a2","Année fin","2026","1")])+F.select("feries","Exclure les jours fériés",[["oui","Oui"],["non","Non"]])},calc:function(){const d1=new Date(Date.UTC(+this.$("a1").value,+this.$("m1").value-1,+this.$("j1").value)),d2=new Date(Date.UTC(+this.$("a2").value,+this.$("m2").value-1,+this.$("j2").value));if(d2<d1)return "Vérifiez les dates.";const fer=["2026-01-01","2026-04-06","2026-05-01","2026-05-08","2026-05-14","2026-05-25","2026-07-14","2026-08-15","2026-11-01","2026-11-11","2026-12-25"];let n=0;for(let d=new Date(d1);d<=d2;d.setUTCDate(d.getUTCDate()+1)){const wd=d.getUTCDay(),key=d.toISOString().slice(0,10);if(wd>=1&&wd<=5&&!(this.$("feries").value==="oui"&&fer.includes(key)))n++}return "<strong>"+n+" jour(s) ouvré(s)</strong><br><p class='small'>Par défaut, jours ouvrés = lundi à vendredi. Les jours fériés sont exclus selon le calendrier 2026 sélectionné.</p>"},source:"Service-Public rappelle qu'une semaine de jours ouvrés comprend généralement lundi à vendredi, tandis que les jours ouvrables comprennent 6 jours. Les conventions et horaires propres à l'entreprise peuvent modifier la situation. citeturn1search1"};window.addEventListener("DOMContentLoaded",()=>Simulateurs.render());</script></body></html>
