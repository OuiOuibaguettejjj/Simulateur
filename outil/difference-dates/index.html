<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Calculateur différence entre deux dates | Simulateur</title><meta name="description" content="Calculez précisément le nombre de jours entre deux dates."><link rel="canonical" href="https://simulateur.site/outil/difference-dates/"><link rel="stylesheet" href="/styles.css"><script src="/simulateurs.js" defer></script><script src="/enter-calcul.js" defer></script></head><body><header><div class="wrap nav"><a class="logo" href="/">Simulateur<span>.</span></a><nav class="navlinks"><a href="/calculateurs/">Calculateurs</a><a href="/simulateurs/">Simulateurs</a><a href="/conversions/">Conversions</a><a href="/comparateurs/">Comparateurs</a><a href="/a-propos/">À propos</a></nav></div></header><main><div class="wrap"><div class="breadcrumb"><a href="/calculateurs/">Calculateurs</a> · Calculateur différence entre deux dates</div><div class="tool"><div class="eyebrow" id="ey"></div><h1 id="title"></h1><p class="tool-intro" id="intro"></p><div id="fields"></div><button class="button-main" onclick="Simulateurs.calc()">Calculer</button><div class="result" id="result">Saisissez vos données puis lancez le calcul.</div><div class="formula"><strong>Méthode et sources</strong><p id="source"></p></div></div></div></main><footer><div class="wrap"><div class="footerlinks"><a href="/">Accueil</a><a href="/mentions-legales/">Mentions légales</a><a href="/confidentialite/">Confidentialité</a><a href="/cgu/">CGU</a></div></div></footer><script>const F={text:(i,l,p="",s="any")=>'<div class="field"><label for="'+i+'">'+l+'</label><input id="'+i+'" type="number" min="0" step="'+s+'" placeholder="'+p+'"></div>',select:(i,l,o)=>'<div class="field"><label for="'+i+'">'+l+'</label><select id="'+i+'">'+o.map(x=>'<option value="'+x[0]+'">'+x[1]+'</option>').join('')+'</select></div>',row:a=>'<div class="row">'+a.join('')+'</div>'};window.TOOL={ey:"DATES",title:"Calculateur différence entre deux dates",intro:"Calculez précisément le nombre de jours entre deux dates.",fields:function(){return F.row([F.text("j1","Jour de départ","1","1"),F.text("m1","Mois de départ","1","1"),F.text("a1","Année de départ","2026","1")])+F.row([F.text("j2","Jour d'arrivée","25","1"),F.text("m2","Mois d'arrivée","9","1"),F.text("a2","Année d'arrivée","2026","1")])},calc:function(){const d1=new Date(Date.UTC(+this.$("a1").value,+this.$("m1").value-1,+this.$("j1").value)),d2=new Date(Date.UTC(+this.$("a2").value,+this.$("m2").value-1,+this.$("j2").value));if(isNaN(d1)||isNaN(d2)||d2<d1)return "Vérifiez les dates.";const days=Math.round((d2-d1)/86400000),weeks=Math.floor(days/7),rem=days%7;return "<strong>"+days+" jour(s)</strong><br><br>Soit "+weeks+" semaine(s) et "+rem+" jour(s).<p class='small'>Le calcul mesure l'écart calendaire entre les deux dates, sans compter automatiquement le jour de départ.</p>"},source:"Différence calendaire calculée en UTC pour éviter les effets d'heure d'été lors du calcul du nombre entier de jours."};window.addEventListener("DOMContentLoaded",()=>Simulateurs.render());</script></body></html>
