<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Calculateur partage de dépenses | Simulateur</title><meta name="description" content="Répartissez une dépense entre plusieurs personnes selon des parts égales ou personnalisées."><link rel="canonical" href="https://simulateur.site/outil/partage-depenses/"><link rel="stylesheet" href="/styles.css"><script src="/simulateurs.js" defer></script><script src="/enter-calcul.js" defer></script></head><body><header><div class="wrap nav"><a class="logo" href="/">Simulateur<span>.</span></a><nav class="navlinks"><a href="/calculateurs/">Calculateurs</a><a href="/simulateurs/">Simulateurs</a><a href="/conversions/">Conversions</a><a href="/comparateurs/">Comparateurs</a><a href="/a-propos/">À propos</a></nav></div></header><main><div class="wrap"><div class="breadcrumb"><a href="/calculateurs/">Calculateurs</a> · Calculateur partage de dépenses</div><div class="tool"><div class="eyebrow" id="ey"></div><h1 id="title"></h1><p class="tool-intro" id="intro"></p><div id="fields"></div><button class="button-main" onclick="Simulateurs.calc()">Calculer</button><div class="result" id="result">Saisissez vos données puis lancez le calcul.</div><div class="formula"><strong>Méthode et sources</strong><p id="source"></p></div></div></div></main><footer><div class="wrap"><div class="footerlinks"><a href="/">Accueil</a><a href="/mentions-legales/">Mentions légales</a><a href="/confidentialite/">Confidentialité</a><a href="/cgu/">CGU</a></div></div></footer><script>const F={text:(i,l,p="",s="any")=>'<div class="field"><label for="'+i+'">'+l+'</label><input id="'+i+'" type="number" min="0" step="'+s+'" placeholder="'+p+'"></div>',select:(i,l,o)=>'<div class="field"><label for="'+i+'">'+l+'</label><select id="'+i+'">'+o.map(x=>'<option value="'+x[0]+'">'+x[1]+'</option>').join('')+'</select></div>',row:a=>'<div class="row">'+a.join('')+'</div>'};window.TOOL={ey:"VIE QUOTIDIENNE",title:"Calculateur partage de dépenses",intro:"Répartissez une dépense entre plusieurs personnes selon des parts égales ou personnalisées.",fields:function(){return F.row([F.text("total","Montant total (€)","120"),F.text("pers","Nombre de personnes","3","1")])+F.select("mode","Répartition",[["egal","Parts égales"],["pct","Pourcentages personnalisés"]])+F.row([F.text("p1","Part personne 1 (%)","50"),F.text("p2","Part personne 2 (%)","30")])+F.text("p3","Part personne 3 (%)","20")},calc:function(){const t=+this.$("total").value||0,n=Math.max(1,Math.round(+this.$("pers").value||1)),mode=this.$("mode").value;if(t<0)return "Montant invalide.";if(mode==="egal")return "<strong>"+this.euro(t/n)+" par personne</strong><br><br>Total : "+this.euro(t)+"<br>Participants : "+n;const a=+this.$("p1").value||0,b=+this.$("p2").value||0,c=+this.$("p3").value||0,s=a+b+c;if(Math.abs(s-100)>.01)return "Les pourcentages doivent totaliser 100 %.";return "<strong>Personne 1 : "+this.euro(t*a/100)+"</strong><br>Personne 2 : "+this.euro(t*b/100)+"<br>Personne 3 : "+this.euro(t*c/100)+"<br><br>Total : "+this.euro(t)},source:"Répartition arithmétique du montant saisi. En mode personnalisé, les parts doivent totaliser exactement 100 %."};window.addEventListener("DOMContentLoaded",()=>Simulateurs.render());</script></body></html>
