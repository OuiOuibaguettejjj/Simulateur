<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Tableau d'amortissement de prêt 2026 | Simulateur</title><meta name="description" content="Visualisez mois par mois la part d'intérêts, de capital remboursé et le capital restant dû."><link rel="canonical" href="https://simulateur.site/outil/tableau-amortissement/"><link rel="stylesheet" href="/styles.css"><script src="/simulateurs.js" defer></script><script src="/enter-calcul.js" defer></script></head><body><header><div class="wrap nav"><a class="logo" href="/">Simulateur<span>.</span></a><nav class="navlinks"><a href="/calculateurs/">Calculateurs</a><a href="/simulateurs/">Simulateurs</a><a href="/conversions/">Conversions</a><a href="/comparateurs/">Comparateurs</a><a href="/a-propos/">À propos</a></nav></div></header><main><div class="wrap"><div class="breadcrumb"><a href="/calculateurs/">Calculateurs</a> · Tableau d'amortissement de prêt 2026</div><div class="tool"><div class="eyebrow" id="ey"></div><h1 id="title"></h1><p class="tool-intro" id="intro"></p><div id="fields"></div><button class="button-main" onclick="Simulateurs.calc()">Calculer</button><div class="result" id="result">Saisissez vos données puis lancez le calcul.</div><div class="formula"><strong>Méthode et sources</strong><p id="source"></p></div></div></div></main><footer><div class="wrap"><div class="footerlinks"><a href="/">Accueil</a><a href="/mentions-legales/">Mentions légales</a><a href="/confidentialite/">Confidentialité</a><a href="/cgu/">CGU</a></div></div></footer><script>const F={text:(i,l,p="",s="any")=>'<div class="field"><label for="'+i+'">'+l+'</label><input id="'+i+'" type="number" min="0" step="'+s+'" placeholder="'+p+'"></div>',select:(i,l,o)=>'<div class="field"><label for="'+i+'">'+l+'</label><select id="'+i+'">'+o.map(x=>'<option value="'+x[0]+'">'+x[1]+'</option>').join('')+'</select></div>',row:a=>'<div class="row">'+a.join('')+'</div>'};window.TOOL={ey:"CRÉDIT",title:"Tableau d'amortissement de prêt 2026",intro:"Visualisez mois par mois la part d'intérêts, de capital remboursé et le capital restant dû.",fields:function(){return F.row([F.text("capital","Capital emprunté (€)","200000"),F.text("taux","Taux nominal annuel (%)","3.5")])+F.row([F.text("duree","Durée du prêt (années)","20"),F.text("lignes","Nombre de mois à afficher","12","1")])},calc:function(){const c=+this.$("capital").value||0,r=(+this.$("taux").value||0)/1200,n=Math.round((+this.$("duree").value||0)*12),s=Math.min(120,Math.max(1,+this.$("lignes").value||12));if(c<=0||n<=0)return "Renseignez des valeurs valides.";const m=r?c*r/(1-Math.pow(1+r,-n)):c/n;let b=c,h="<div><strong>Mensualité hors assurance : "+this.euro(m)+"</strong></div><br><table style='width:100%;border-collapse:collapse'><tr><th>Mois</th><th>Intérêts</th><th>Capital</th><th>Restant</th></tr>";for(let i=1;i<=s;i++){const it=b*r,ca=Math.min(m-it,b);b=Math.max(0,b-ca);h+="<tr><td>"+i+"</td><td>"+this.euro(it)+"</td><td>"+this.euro(ca)+"</td><td>"+this.euro(b)+"</td></tr>"}return h+"</table><p class='small'>Hors assurance, garantie, frais de dossier et autres coûts.</p>"},source:"Formule d'annuité à taux fixe. Le tableau distingue intérêts et amortissement du capital ; le coût réel d'un crédit se compare notamment via le TAEG, qui inclut les frais pertinents."};window.addEventListener("DOMContentLoaded",()=>Simulateurs.render());</script></body></html>
