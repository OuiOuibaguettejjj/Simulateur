<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Comparateur de placements 2026 | Simulateur</title><meta name="description" content="Comparez deux placements selon rendement, frais, durée et fiscalité simplifiée."><link rel="canonical" href="https://simulateur.site/outil/comparateur-placements/"><link rel="stylesheet" href="/styles.css"><script src="/simulateurs.js" defer></script><script src="/enter-calcul.js" defer></script></head><body><header><div class="wrap nav"><a class="logo" href="/">Simulateur<span>.</span></a><nav class="navlinks"><a href="/calculateurs/">Calculateurs</a><a href="/simulateurs/">Simulateurs</a><a href="/conversions/">Conversions</a><a href="/comparateurs/">Comparateurs</a><a href="/a-propos/">À propos</a></nav></div></header><main><div class="wrap"><div class="breadcrumb"><a href="/calculateurs/">Calculateurs</a> · Comparateur de placements 2026</div><div class="tool"><div class="eyebrow" id="ey"></div><h1 id="title"></h1><p class="tool-intro" id="intro"></p><div id="fields"></div><button class="button-main" onclick="Simulateurs.calc()">Calculer</button><div class="result" id="result">Saisissez vos données puis lancez le calcul.</div><div id="placement-chart" hidden style="margin-top:24px;border:1px solid rgba(15,23,42,.10);border-radius:22px;background:linear-gradient(145deg,#fff,#f8fafc);box-shadow:0 14px 38px rgba(15,23,42,.08);overflow:hidden;padding:18px"><div style="display:flex;justify-content:space-between;gap:12px;align-items:baseline;flex-wrap:wrap"><strong>Évolution projetée</strong><span class="small">Capital net des frais saisis</span></div><svg id="placement-svg" viewBox="0 0 720 300" role="img" aria-label="Évolution comparée des deux placements" style="display:block;width:100%;height:auto;margin-top:10px"></svg><div id="placement-legend" style="display:flex;gap:18px;flex-wrap:wrap;margin-top:8px;font-size:.9rem"><span>— Placement A</span><span>— Placement B</span></div></div><div class="formula"><strong>Méthode et sources</strong><p id="source"></p></div></div></div></main><footer><div class="wrap"><div class="footerlinks"><a href="/">Accueil</a><a href="/mentions-legales/">Mentions légales</a><a href="/confidentialite/">Confidentialité</a><a href="/cgu/">CGU</a></div></div></footer><script>const F={text:(i,l,p="",s="any")=>'<div class="field"><label for="'+i+'">'+l+'</label><input id="'+i+'" type="number" min="0" step="'+s+'" placeholder="'+p+'"></div>',select:(i,l,o)=>'<div class="field"><label for="'+i+'">'+l+'</label><select id="'+i+'">'+o.map(x=>'<option value="'+x[0]+'">'+x[1]+'</option>').join('')+'</select></div>',row:a=>'<div class="row">'+a.join('')+'</div>'};window.TOOL={ey:"ÉPARGNE",title:"Comparateur de placements 2026",intro:"Comparez deux placements selon rendement, frais, durée et fiscalité simplifiée.",fields:function(){return F.row([F.text("a","Capital placement A (€)","10000"),F.text("b","Capital placement B (€)","10000")])+F.row([F.text("ra","Rendement A (%)","3"),F.text("rb","Rendement B (%)","5")])+F.row([F.text("fa","Frais annuels A (%)","0.2"),F.text("fb","Frais annuels B (%)","0.5")])+F.text("n","Durée (années)","10")},calc:function(){const a=+this.$("a").value||0,b=+this.$("b").value||0,ra=(+this.$("ra").value||0)/100-(+this.$("fa").value||0)/100,rb=(+this.$("rb").value||0)/100-(+this.$("fb").value||0)/100,n=+this.$("n").value||0;if(a<0||b<0||n<0)return "Renseignez des valeurs valides.";const A=a*Math.pow(1+ra,n),B=b*Math.pow(1+rb,n),ec=A>B?"A":"B";drawPlacementChart(a,b,ra,rb,n);return "<strong>Placement "+ec+" donne le capital final le plus élevé selon vos hypothèses.</strong><br><br>A : "+this.euro(A)+"<br>B : "+this.euro(B)+"<p class='small'>Comparaison mathématique hors fiscalité, versements supplémentaires et risque. Un rendement historique n'est pas une garantie de rendement futur.</p>"},source:"Méthode : capitalisation composée du rendement annuel net des frais saisis. Les performances et la fiscalité réelles dépendent du produit et du cadre fiscal."};window.addEventListener("DOMContentLoaded",()=>Simulateurs.render());function drawPlacementChart(a,b,ra,rb,n){const box=document.getElementById("placement-chart"),svg=document.getElementById("placement-svg");if(!box||!svg)return;const W=720,H=300,p={l:58,r:18,t:18,b:38},iw=W-p.l-p.r,ih=H-p.t-p.b;const steps=Math.min(20,Math.max(1,Math.ceil(n))),rows=[];for(let i=0;i<=steps;i++){const y=n*i/steps;rows.push([y,a*Math.pow(1+ra,y),b*Math.pow(1+rb,y)])}const max=Math.max(a,b,...rows.map(x=>Math.max(x[1],x[2])),1),nice=Math.max(1,max);const x=y=>p.l+(y/n)*iw||p.l,y=v=>p.t+ih-(v/max)*ih,pts=rows.map(q=>q.map((v,i)=>i===0?v:x(v)));let s="";for(let i=0;i<=4;i++){const v=max*i/4,yy=y(v);s+='<line x1="'+p.l+'" y1="'+yy+'" x2="'+(W-p.r)+'" y2="'+yy+'" stroke="rgba(15,23,42,.08)"/><text x="'+(p.l-8)+'" y="'+(yy+4)+'" text-anchor="end" font-size="11" fill="#64748b">'+formatChartEuro(v)+'</text>'}s+='<line x1="'+p.l+'" y1="'+(H-p.b)+'" x2="'+(W-p.r)+'" y2="'+(H-p.b)+'" stroke="#cbd5e1"/>';const path=(idx)=>rows.map((q,i)=>(i?"L":"M")+x(q[0]).toFixed(1)+" "+y(q[idx]).toFixed(1)).join(" ");s+='<path d="'+path(1)+'" fill="none" stroke="#111827" stroke-width="4" stroke-linecap="round"/><path d="'+path(2)+'" fill="none" stroke="#94a3b8" stroke-width="3" stroke-dasharray="7 6" stroke-linecap="round"/>';rows.forEach(q=>{s+='<circle cx="'+x(q[0]).toFixed(1)+'" cy="'+y(q[1]).toFixed(1)+'" r="3.5" fill="#111827"/><circle cx="'+x(q[0]).toFixed(1)+'" cy="'+y(q[2]).toFixed(1)+'" r="3.5" fill="#94a3b8"/>'});for(let i=0;i<=4;i++){const yy=H-p.b+5,xx=p.l+iw*i/4;s+='<text x="'+xx+'" y="'+(yy+18)+'" text-anchor="middle" font-size="11" fill="#64748b">'+(n*i/4).toFixed(i===4?0:1)+' an</text>'}svg.innerHTML=s;box.hidden=false}function formatChartEuro(v){return new Intl.NumberFormat("fr-FR",{maximumFractionDigits:0,notation:"compact"}).format(v)+" €"}</script></body></html>
