<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Pourboire | Simulateur</title><meta name="description" content="Calculez le pourboire et le total d'une addition."><link rel="canonical" href="https://simulateur.site/outil/pourboire/"><link rel="stylesheet" href="/styles.css"><script src="/simulateurs.js" defer></script><script src="/enter-calcul.js" defer></script></head><body><main><div class="wrap"><div class="tool"><div class="eyebrow" id="ey">Pourboire</div><h1 id="title">Pourboire</h1><p id="intro">Calculez le pourboire et le total d'une addition.</p><div id="fields"><div class="field"><label for="a">Addition (€)</label><input id="a" type="number" value="50"></div><div class="field"><label for="p">Pourboire (%)</label><input id="p" type="number" value="10"></div></div><button class="button-main" onclick="Simulateurs.calc()">Calculer</button><div class="result" id="result"></div><div class="formula"><p id="source">Calculez le pourboire et le total d'une addition.</p></div></div></div></main><script>window.TOOL={ey:"Pourboire",title:"Pourboire",intro:"Calculez le pourboire et le total d'une addition.",fields:function(){},calc:function(){const a=+this.$("a").value,p=+this.$("p").value;if(a<0||p<0)return"Valeurs invalides.";const t=a*p/100;return"<strong>"+this.euro(t)+" de pourboire</strong><br><br>Total : "+this.euro(a+t)},source:"Calculez le pourboire et le total d'une addition."};window.addEventListener("DOMContentLoaded",()=>Simulateurs.render());</script></body></html>
