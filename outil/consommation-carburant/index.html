<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Calculateur consommation carburant | Simulateur</title><meta name="description" content="Calculez votre consommation en L/100 km et le coût de vos trajets."><link rel="canonical" href="https://simulateur.site/outil/consommation-carburant/"><link rel="stylesheet" href="/styles.css"><script src="/simulateurs.js" defer></script><script src="/enter-calcul.js" defer></script></head><body><header><div class="wrap nav"><a class="logo" href="/">Simulateur<span>.</span></a><nav class="navlinks"><a href="/calculateurs/">Calculateurs</a><a href="/simulateurs/">Simulateurs</a><a href="/conversions/">Conversions</a><a href="/comparateurs/">Comparateurs</a><a href="/a-propos/">À propos</a></nav></div></header><main><div class="wrap"><div class="breadcrumb"><a href="/calculateurs/">Calculateurs</a> · Calculateur consommation carburant</div><div class="tool"><div class="eyebrow" id="ey"></div><h1 id="title"></h1><p class="tool-intro" id="intro"></p><div id="fields"></div><button class="button-main" onclick="Simulateurs.calc()">Calculer</button><div class="result" id="result">Saisissez vos données puis lancez le calcul.</div><div class="formula"><strong>Méthode et sources</strong><p id="source"></p></div></div></div></main><footer><div class="wrap"><div class="footerlinks"><a href="/">Accueil</a><a href="/mentions-legales/">Mentions légales</a><a href="/confidentialite/">Confidentialité</a><a href="/cgu/">CGU</a></div></div></footer><script>const F={text:(i,l,p="",s="any")=>'<div class="field"><label for="'+i+'">'+l+'</label><input id="'+i+'" type="number" min="0" step="'+s+'" placeholder="'+p+'"></div>',select:(i,l,o)=>'<div class="field"><label for="'+i+'">'+l+'</label><select id="'+i+'">'+o.map(x=>'<option value="'+x[0]+'">'+x[1]+'</option>').join('')+'</select></div>',row:a=>'<div class="row">'+a.join('')+'</div>'};window.TOOL={ey:"AUTOMOBILE",title:"Calculateur consommation carburant",intro:"Calculez votre consommation en L/100 km et le coût de vos trajets.",fields:function(){return F.row([F.text("litres","Litres consommés","45"),F.text("km","Kilomètres parcourus","600")])+F.row([F.text("prix","Prix du carburant (€/L)","1.70"),F.text("trajets","Nombre de trajets identiques","1")])},calc:function(){const l=+this.$("litres").value||0,k=+this.$("km").value||0,p=+this.$("prix").value||0,t=Math.max(1,+this.$("trajets").value||1);if(l<0||k<=0||p<0)return "Renseignez des valeurs valides.";const c=l/k*100,cost=l*p;return "<strong>"+c.toFixed(2)+" L/100 km</strong><br><br>Coût du trajet : "+this.euro(cost)+"<br>Coût pour 100 km : "+this.euro(c*p)+"<br>"+t+" trajet(s) : "+this.euro(cost*t)+"<p class='small'>Le coût réel dépend du prix payé et de la consommation effectivement mesurée.</p>"},source:"Formule standard : consommation = litres consommés / kilomètres parcourus × 100. Le prix du carburant est saisi par l'utilisateur ; le barème fiscal de carburant est un dispositif distinct pour les frais professionnels."};window.addEventListener("DOMContentLoaded",()=>Simulateurs.render());</script></body></html>
