<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Fractions | Simulateur</title><meta name="description" content="Calculez le résultat de deux fractions."><link rel="canonical" href="https://simulateur.site/outil/fractions/"><link rel="stylesheet" href="/styles.css"><script src="/simulateurs.js" defer></script><script src="/enter-calcul.js" defer></script></head><body><main><div class="wrap"><div class="tool"><div class="eyebrow" id="ey">MATHÉMATIQUES</div><h1 id="title">Fractions</h1><p id="intro">Calculez le résultat de deux fractions.</p><div id="fields"><div class="field"><label for="a">Numérateur A</label><input id="a" type="number" value="1"></div><div class="field"><label for="b">Dénominateur A</label><input id="b" type="number" value="2"></div><div class="field"><label for="c">Numérateur B</label><input id="c" type="number" value="1"></div><div class="field"><label for="d">Dénominateur B</label><input id="d" type="number" value="3"></div></div><button class="button-main" onclick="Simulateurs.calc()">Calculer</button><div class="result" id="result"></div><div class="formula"><p id="source">Calculez le résultat de deux fractions.</p></div></div></div></main><script>window.TOOL={ey:"MATHÉMATIQUES",title:"Fractions",intro:"Calculez le résultat de deux fractions.",fields:function(){},calc:function(){const a=+this.$("a").value,b=+this.$("b").value,c=+this.$("c").value,d=+this.$("d").value;if(!b||!d)return"Valeurs invalides.";return"<strong>"+(a/b+c/d).toLocaleString("fr-FR")+"</strong>"},source:"Calculez le résultat de deux fractions."};window.addEventListener("DOMContentLoaded",()=>Simulateurs.render());</script></body></html>
