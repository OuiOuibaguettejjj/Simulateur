<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Calculateur de durée | Simulateur</title><meta name="description" content="Convertissez heures, minutes et secondes."><link rel="canonical" href="https://simulateur.site/outil/temps-calcul/"><link rel="stylesheet" href="/styles.css"><script src="/simulateurs.js" defer></script><script src="/enter-calcul.js" defer></script></head><body><main><div class="wrap"><div class="tool"><div class="eyebrow" id="ey">TEMPS</div><h1 id="title">Calculateur de durée</h1><p id="intro">Convertissez heures, minutes et secondes.</p><div id="fields"><div class="field"><label for="h">Heures</label><input id="h" type="number" value="2"></div><div class="field"><label for="m">Minutes</label><input id="m" type="number" value="30"></div></div><button class="button-main" onclick="Simulateurs.calc()">Calculer</button><div class="result" id="result"></div><div class="formula"><p id="source">Convertissez heures, minutes et secondes.</p></div></div></div></main><script>window.TOOL={ey:"TEMPS",title:"Calculateur de durée",intro:"Convertissez heures, minutes et secondes.",fields:function(){},calc:function(){const h=+this.$("h").value,m=+this.$("m").value;if(h<0||m<0)return"Valeurs invalides.";return"<strong>"+(h+m/60).toFixed(2)+" heure(s)</strong>"},source:"Convertissez heures, minutes et secondes."};window.addEventListener("DOMContentLoaded",()=>Simulateurs.render());</script></body></html>
