<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Épargne | Simulateur</title><meta name="description" content="Projetez un capital avec versements et rendement."><link rel="canonical" href="https://simulateur.site/outil/epargne/"><link rel="stylesheet" href="/styles.css"><script src="/simulateurs.js" defer></script><script src="/enter-calcul.js" defer></script></head><body><main><div class="wrap"><div class="tool"><div class="eyebrow" id="ey">ÉPARGNE</div><h1 id="title">Épargne</h1><p id="intro">Projetez un capital avec versements et rendement.</p><div id="fields"><div class="field"><label for="c">Capital initial (€)</label><input id="c" type="number" value="10000"></div><div class="field"><label for="m">Versement mensuel (€)</label><input id="m" type="number" value="300"></div><div class="field"><label for="r">Rendement annuel (%)</label><input id="r" type="number" value="4"></div><div class="field"><label for="y">Durée (années)</label><input id="y" type="number" value="10"></div></div><button class="button-main" onclick="Simulateurs.calc()">Calculer</button><div class="result" id="result"></div><div class="formula"><p id="source">Projetez un capital avec versements et rendement.</p></div></div></div></main><script>window.TOOL={ey:"ÉPARGNE",title:"Épargne",intro:"Projetez un capital avec versements et rendement.",fields:function(){},calc:function(){const c=+this.$("c").value,m=+this.$("m").value,r=(+this.$("r").value||0)/1200,n=(+this.$("y").value||0)*12,f=c*Math.pow(1+r,n)+m*(r?((Math.pow(1+r,n)-1)/r):n);return"<strong>"+this.euro(f)+"</strong>"},source:"Projetez un capital avec versements et rendement."};window.addEventListener("DOMContentLoaded",()=>Simulateurs.render());</script></body></html>
