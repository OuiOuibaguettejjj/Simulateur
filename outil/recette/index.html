<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Adaptateur de recette | Simulateur</title><meta name="description" content="Adaptez une quantité au nombre de personnes."><link rel="canonical" href="https://simulateur.site/outil/recette/"><link rel="stylesheet" href="/styles.css"><script src="/simulateurs.js" defer></script><script src="/enter-calcul.js" defer></script></head><body><main><div class="wrap"><div class="tool"><div class="eyebrow" id="ey">Adaptateur de recette</div><h1 id="title">Adaptateur de recette</h1><p id="intro">Adaptez une quantité au nombre de personnes.</p><div id="fields"><div class="field"><label for="p">Personnes prévues</label><input id="p" type="number" value="4"></div><div class="field"><label for="q">Personnes souhaitées</label><input id="q" type="number" value="6"></div><div class="field"><label for="x">Quantité initiale</label><input id="x" type="number" value="500"></div></div><button class="button-main" onclick="Simulateurs.calc()">Calculer</button><div class="result" id="result"></div><div class="formula"><p id="source">Adaptez une quantité au nombre de personnes.</p></div></div></div></main><script>window.TOOL={ey:"Adaptateur de recette",title:"Adaptateur de recette",intro:"Adaptez une quantité au nombre de personnes.",fields:function(){},calc:function(){const p=+this.$("p").value,q=+this.$("q").value,x=+this.$("x").value;if(p<=0||q<=0)return"Valeurs invalides.";return"<strong>"+(x*q/p).toLocaleString("fr-FR")+"</strong>"},source:"Adaptez une quantité au nombre de personnes."};window.addEventListener("DOMContentLoaded",()=>Simulateurs.render());</script></body></html>
