<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Calculateur indemnités maternité / paternité 2026 | Simulateur</title><meta name="description" content="Estimez vos indemnités journalières maternité ou paternité à partir des salaires récents."><link rel="canonical" href="https://simulateur.site/outil/indemnites-maternite-paternite/"><link rel="stylesheet" href="/styles.css"><script src="/simulateurs.js" defer></script><script src="/enter-calcul.js" defer></script></head><body><header><div class="wrap nav"><a class="logo" href="/">Simulateur<span>.</span></a><nav class="navlinks"><a href="/calculateurs/">Calculateurs</a><a href="/simulateurs/">Simulateurs</a><a href="/conversions/">Conversions</a><a href="/comparateurs/">Comparateurs</a><a href="/a-propos/">À propos</a></nav></div></header><main><div class="wrap"><div class="breadcrumb"><a href="/calculateurs/">Calculateurs</a> · Calculateur indemnités maternité / paternité 2026</div><div class="tool"><div class="eyebrow" id="ey"></div><h1 id="title"></h1><p class="tool-intro" id="intro"></p><div id="fields"></div><button class="button-main" onclick="Simulateurs.calc()">Calculer</button><div class="result" id="result">Saisissez vos données puis lancez le calcul.</div><div class="formula"><strong>Méthode et sources</strong><p id="source"></p></div></div></div></main><footer><div class="wrap"><div class="footerlinks"><a href="/">Accueil</a><a href="/mentions-legales/">Mentions légales</a><a href="/confidentialite/">Confidentialité</a><a href="/cgu/">CGU</a></div></div></footer><script>const F={text:(i,l,p="",s="any")=>'<div class="field"><label for="'+i+'">'+l+'</label><input id="'+i+'" type="number" min="0" step="'+s+'" placeholder="'+p+'"></div>',select:(i,l,o)=>'<div class="field"><label for="'+i+'">'+l+'</label><select id="'+i+'">'+o.map(x=>'<option value="'+x[0]+'">'+x[1]+'</option>').join('')+'</select></div>',row:a=>'<div class="row">'+a.join('')+'</div>'};window.TOOL={ey:"ASSURANCE MALADIE",title:"Calculateur indemnités maternité / paternité 2026",intro:"Estimez vos indemnités journalières maternité ou paternité à partir des salaires récents.",fields:function(){return F.row([F.text("sal","Total des salaires bruts des 3 derniers mois (€)","10500"),F.text("jours","Nombre de jours indemnisés","25","1")])+F.select("type","Congé",[["maternite","Maternité"],["paternite","Paternité / accueil de l'enfant"]])},calc:function(){const sal=+this.$("sal").value||0,j=Math.max(0,+this.$("jours").value||0),type=this.$("type").value;const plafond=4005*3,sjb=Math.min(sal,plafond)/91.25,ij=Math.min(104.02,sjb*.79),total=ij*j;return "<strong>"+this.euro(total)+" estimés</strong><br><br>Indemnité journalière : "+this.euro(ij)+"<br>Jours indemnisés : "+j+"<p class=\'small\'>Le calcul réel dépend notamment de l’ouverture des droits, de la période de référence et des situations particulières. Les IJ sont versées sans délai de carence pendant ces congés.</p>"},source:"Assurance Maladie : en 2026, le plafond mensuel de la Sécurité sociale est de 4 005 € et l'IJ maternité/paternité peut atteindre 104,02 € par jour. Le calcul repose sur les salaires de référence et une déduction forfaitaire de 21 %, soit environ 79 % du gain journalier de base."};window.addEventListener("DOMContentLoaded",()=>Simulateurs.render());</script></body></html>
