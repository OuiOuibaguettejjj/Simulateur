name: Deploy Simulateur to Cloudflare
# SEO prerender runs before all production checks.

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 2

      - name: Pre-render calculator SEO HTML
        run: node scripts/prerender-tools.mjs

      - name: Verify commit and consistency before production
        run: |
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          node <<'NODE'
          const fs = require('fs');
          const cp = require('child_process');
          const errors = [];
          const minimumSitemapUrls = 106;
          const critical = [
            ['public/outil/interets-composes/index.html', 8000, ['<svg', '<table', 'Et si']],
            ['public/outil/signe-astrologique/index.html', 8000, ['ascendant', 'Calculs associés']],
            ['public/outil/preavis-demission/index.html', 5000, ['Préavis', 'source']]
          ];
          const sitemap = fs.readFileSync('public/sitemap.xml', 'utf8');
          const urls = [...sitemap.matchAll(/<loc>([^<]+)<\/loc>/g)].map(m => m[1]);
          if (urls.length < minimumSitemapUrls) errors.push(`sitemap regression: ${urls.length} URLs < ${minimumSitemapUrls}`);
          let parentSitemap = '';
          try { parentSitemap = cp.execFileSync('git', ['show', 'HEAD^:public/sitemap.xml'], {encoding:'utf8'}); } catch {}
          if (parentSitemap) {
            const parentCount = (parentSitemap.match(/<loc>/g) || []).length;
            if (urls.length < parentCount) errors.push(`sitemap lost URLs: ${parentCount} -> ${urls.length}`);
          }
          for (const [file, minBytes, markers] of critical) {
            if (!fs.existsSync(file)) { errors.push(`missing critical file: ${file}`); continue; }
            const html = fs.readFileSync(file, 'utf8');
            if (html.length < minBytes) errors.push(`critical page too small: ${file} (${html.length} bytes)`);
            for (const marker of markers) if (!html.toLowerCase().includes(marker.toLowerCase())) errors.push(`critical marker missing in ${file}: ${marker}`);
          }
          const changed = cp.execFileSync('git', ['diff', '--name-only', 'HEAD^', 'HEAD', '--', 'public'], {encoding:'utf8'}).trim().split(/\r?\n/).filter(Boolean);
          for (const file of changed.filter(f => f.startsWith('public/outil/') && f.endsWith('.html'))) {
            let parent = '';
            try { parent = cp.execFileSync('git', ['show', `HEAD^:${file}`], {encoding:'utf8'}); } catch {}
            const current = fs.readFileSync(file, 'utf8');
            if (parent.length >= 2000 && current.length < parent.length * 0.65) errors.push(`destructive HTML shrink detected: ${file} (${parent.length} -> ${current.length} bytes)`);
          }
          if (errors.length) { console.error(errors.join('\n')); process.exit(1); }
          console.log(`Consistency guard passed: ${urls.length} sitemap URLs; ${changed.length} public files changed.`);
          NODE

      - name: Verify prerendered SEO HTML
        run: |
          node <<'NODE'
          const fs = require('fs');
          const path = require('path');
          const errors = [];
          let checked = 0;
          function walk(dir) {
            const files = [];
            for (const entry of fs.readdirSync(dir, {withFileTypes:true})) {
              const p = path.join(dir, entry.name);
              if (entry.isDirectory()) files.push(...walk(p));
              else if (entry.isFile() && entry.name === 'index.html') files.push(p);
            }
            return files;
          }
          for (const file of walk('public/outil')) {
            const html = fs.readFileSync(file, 'utf8');
            if (!/window\.TOOL\s*=/.test(html)) continue;
            checked++;
            const h1 = html.match(/<h1\b[^>]*\bid=["']title["'][^>]*>([\s\S]*?)<\/h1>/i);
            if (!h1 || !h1[1].replace(/<[^>]+>/g, '').trim()) errors.push(file + ': empty #title H1');
            const source = html.match(/<p\b[^>]*\bid=["']source["'][^>]*>([\s\S]*?)<\/p>/i);
            if (!source || !source[1].replace(/<[^>]+>/g, '').trim()) errors.push(file + ': empty #source');
            const fields = html.match(/<div\b[^>]*\bid=["']fields["']([^>]*)>([\s\S]*?)<\/div>/i);
            if (!fields) errors.push(file + ': missing #fields');
            else if (!/\bhidden(?:\s*=|\b)/i.test(fields[1]) && !/<(?:input|select|textarea|button)\b/i.test(fields[2])) errors.push(file + ': empty #fields');
            const jsonLd = [...html.matchAll(/<script\b[^>]*type=["']application\/ld\+json["'][^>]*>([\s\S]*?)<\/script>/gi)].map(m => m[1]);
            const breadcrumbCount = jsonLd.filter(s => /"@type"\s*:\s*"BreadcrumbList"/.test(s)).length;
            const webApplicationCount = jsonLd.filter(s => /"@type"\s*:\s*"WebApplication"/.test(s)).length;
            if (breadcrumbCount !== 1) errors.push(file + ': expected exactly one BreadcrumbList, found ' + breadcrumbCount);
            if (webApplicationCount !== 1) errors.push(file + ': expected exactly one WebApplication, found ' + webApplicationCount);
            const titleCount = [...html.matchAll(/<title\b[^>]*>[\s\S]*?<\/title>/gi)].length;
            if (titleCount !== 1) errors.push(file + ': expected exactly one title, found ' + titleCount);
          }
          console.log('Prerender SEO guard checked ' + checked + ' calculator pages.');
          if (errors.length) { console.error(errors.join('\n')); process.exit(1); }
          NODE

      - name: Validate complete static site
        run: |
          node <<'NODE'
          const fs = require('fs');
          const path = require('path');
          const vm = require('vm');

          const root = 'public';
          const files = [];
          const allFiles = new Set();

          function walk(dir) {
            for (const entry of fs.readdirSync(dir, { withFileTypes: true })) {
              const p = path.join(dir, entry.name);
              if (entry.isDirectory()) walk(p);
              else if (entry.isFile()) {
                allFiles.add(p.replaceAll(path.sep, '/'));
                if (p.endsWith('.html')) files.push(p.replaceAll(path.sep, '/'));
              }
            }
          }
          walk(root);

          const errors = [];
          const canonicals = new Map();

          function publicPathForFile(file) {
            const rel = file.slice('public'.length);
            if (rel === '/index.html') return '/';
            if (rel.endsWith('/index.html')) return rel.slice(0, -'index.html'.length);
            return rel;
          }

          function existsPublicPath(urlPath) {
            if (urlPath === '/') return allFiles.has('public/index.html');
            const clean = urlPath.replace(/^\//, '').replace(/\/$/, '');
            if (allFiles.has('public/' + clean)) return true;
            if (allFiles.has('public/' + clean + '/index.html')) return true;
            return false;
          }

          for (const file of files) {
            const html = fs.readFileSync(file, 'utf8');
            const route = publicPathForFile(file);

            if (html.includes('--- TRUNCATED ---')) errors.push(file + ': truncation marker');
            if (!/^<!doctype html>/i.test(html.trim())) errors.push(file + ': missing doctype');
            if (!/<html\b[^>]*>/i.test(html)) errors.push(file + ': missing html element');
            if (!/<head\b[^>]*>/i.test(html)) errors.push(file + ': missing head');
            if (!/<body\b[^>]*>/i.test(html)) errors.push(file + ': missing body');
            if (!/<\/html>/i.test(html)) errors.push(file + ': missing closing html tag');

            const titles = [...html.matchAll(/<title>[^<]+<\/title>/gi)];
            if (titles.length !== 1) errors.push(file + ': expected exactly one title, found ' + titles.length);

            const canonicalMatches = [...html.matchAll(/<link[^>]+rel=["']canonical["'][^>]+href=["']([^"']+)["']/gi)];
            if (file === 'public/404.html') {
              if (canonicalMatches.length > 1) errors.push(file + ': more than one canonical');
            } else if (canonicalMatches.length !== 1) {
              errors.push(file + ': expected exactly one canonical, found ' + canonicalMatches.length);
            } else {
              const canonical = canonicalMatches[0][1];
              if (!canonical.startsWith('https://simulateur.site/')) errors.push(file + ': canonical outside simulateur.site: ' + canonical);
              if (canonicals.has(canonical)) errors.push(file + ': duplicate canonical ' + canonical + ' (also ' + canonicals.get(canonical) + ')');
              canonicals.set(canonical, file);
            }

            if (html.toLowerCase().includes('repere')) errors.push(file + ': obsolete brand string "repere"');
            if (html.includes('repere.workers.dev')) errors.push(file + ': obsolete workers.dev domain');

            if (file.startsWith('public/outil/')) {
              if (html.length < 1000) errors.push(file + ': calculator page suspiciously small (' + html.length + ' bytes)');
              if (!/<script\b/i.test(html)) errors.push(file + ': calculator has no JavaScript');
              if (!/<button\b/i.test(html)) errors.push(file + ': calculator has no button');
            }

            for (const match of html.matchAll(/<script([^>]*)>([\s\S]*?)<\/script>/gi)) {
              const attrs = match[1];
              const typeMatch = attrs.match(/\btype=["']([^"']+)["']/i);
              const type = typeMatch ? typeMatch[1].toLowerCase() : "";
              if (type && !["text/javascript", "application/javascript", "application/ecmascript", "text/ecmascript", "module"].includes(type)) continue;
              const js = match[2].trim();
              if (!js) continue;
              try { new vm.Script(js, {filename:file}); }
              catch (e) { errors.push(file + ': JavaScript syntax error: ' + e.message); }
            }

            for (const match of html.matchAll(/(?:href|src)=["']([^"']+)["']/gi)) {
              const target = match[1];
              if (!target || target.startsWith('#') || /^(https?:|mailto:|tel:|data:|javascript:)/i.test(target)) continue;
              const targetPath = target.split(/[?#]/)[0];
              if (targetPath.startsWith('/') && !existsPublicPath(targetPath)) {
                errors.push(file + ': broken internal path ' + targetPath);
              }
            }
          }

          if (allFiles.has('public/sitemap.xml')) {
            const sitemap = fs.readFileSync('public/sitemap.xml', 'utf8');
            const sitemapUrls = [...sitemap.matchAll(/<loc>([^<]+)<\/loc>/g)].map(m => m[1]);
            const seen = new Set();
            for (const url of sitemapUrls) {
              if (seen.has(url)) errors.push('public/sitemap.xml: duplicate URL ' + url);
              seen.add(url);
              if (!url.startsWith('https://simulateur.site/')) errors.push('public/sitemap.xml: URL outside canonical domain ' + url);
              else if (!existsPublicPath(new URL(url).pathname)) errors.push('public/sitemap.xml: broken URL ' + url);
            }
            if (sitemapUrls.includes('https://simulateur.site/404.html')) errors.push('public/sitemap.xml: 404 page must not be indexed');
          }

          if (!allFiles.has('public/styles.css')) errors.push('public/styles.css: missing');
          if (!allFiles.has('public/robots.txt')) errors.push('public/robots.txt: missing');
          if (!allFiles.has('public/sitemap.xml')) errors.push('public/sitemap.xml: missing');
          if (allFiles.has('public/simulateurs.js')) {
            try { new vm.Script(fs.readFileSync('public/simulateurs.js','utf8'), {filename:'public/simulateurs.js'}); }
            catch (e) { errors.push('public/simulateurs.js: JavaScript syntax error: ' + e.message); }
          }

          const toolCount = files.filter(f => f.startsWith('public/outil/')).length;
          console.log('Validated ' + files.length + ' HTML pages and ' + toolCount + ' calculator pages.');

          if (errors.length) {
            console.error(errors.join('\n'));
            process.exit(1);
          }
          NODE

      - name: Run deterministic calculator tests
        run: node tests/rsa.test.js

      - name: Smoke-test every calculator in Chromium
        run: |
          npm init -y >/dev/null 2>&1
          npm install --no-save playwright@1.55.0 >/dev/null 2>&1
          npx playwright install chromium >/dev/null 2>&1
          python3 -m http.server 4173 --directory public >/tmp/simulateur-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID' EXIT
          sleep 2
          node <<'NODE'
          const fs = require('fs');
          const { chromium } = require('playwright');

          function walk(dir, out=[]) {
            for (const e of fs.readdirSync(dir,{withFileTypes:true})) {
              const p=dir+'/'+e.name;
              if(e.isDirectory()) walk(p,out);
              else if(e.isFile() && p.endsWith('.html')) out.push(p);
            }
            return out;
          }

          (async()=>{
            const files=walk('public');
            const browser=await chromium.launch({headless:true});
            const errors=[];
            for(const file of files){
              const route='/'+file.slice('public/'.length).replace(/\/index\.html$/,'/');
              const page=await browser.newPage();
          async function populate(page) {
            await page.locator('input').evaluateAll((inputs) => {
              for (const input of inputs) {
                if (input.type === 'date') input.value = '2020-01-15';
                else if (input.type === 'number') input.value = input.min && Number(input.min) > 10 ? input.min : '10';
                else if (input.type !== 'hidden') input.value = 'test';
                input.dispatchEvent(new Event('input', {bubbles:true}));
                input.dispatchEvent(new Event('change', {bubbles:true}));
              }
            });
            await page.locator('select').evaluateAll((selects) => {
              for (const select of selects) {
                if (select.options.length) {
                  select.selectedIndex = 0;
                  select.dispatchEvent(new Event('change', {bubbles:true}));
                }
              }
            });
          }

              await page.route('**/api/devises', route => route.fulfill({status:200, contentType:'application/json', body:JSON.stringify({date:'2026-09-25', rates:{EUR:1,USD:1.17,GBP:0.87,CHF:0.94}})}));
              const consoleErrors=[];
              const pageErrors=[];
              page.on('console',m=>{if(m.type()==='error' && !/cloudflareinsights|beacon\.min\.js/i.test(m.text())) consoleErrors.push(m.text())});
              page.on('pageerror',e=>pageErrors.push(String(e)));
              try{
                const response=await page.goto('http://127.0.0.1:4173'+route,{waitUntil:'load',timeout:10000});
                if(!response || response.status()!==200) errors.push(file+': HTTP '+(response&&response.status()));
                const title=await page.title();
                if(!title) errors.push(file+': empty title');
                if(file.startsWith('public/outil/') && await page.locator('button').count()===0) errors.push(file+': no button');
                await populate(page);
              const buttons=page.locator('button');
                const n=file.startsWith('public/outil/') ? await buttons.count() : 0;
                for(let i=0;i<n;i++){
                  try{await buttons.nth(i).click({timeout:1500}); await page.waitForTimeout(30);}catch(e){errors.push(file+': button '+i+' click failed: '+e.message)}
                }
                if(consoleErrors.length) errors.push(file+': console.error: '+consoleErrors.join(' | '));
                if(pageErrors.length) errors.push(file+': pageerror: '+pageErrors.join(' | '));
              }catch(e){errors.push(file+': '+e.message)}
              await page.close();
            }
            await browser.close();
            console.log('Smoke-tested '+files.length+' public HTML pages, including '+files.filter(f=>f.startsWith('public/outil/')).length+' calculators.');
            if(errors.length){console.error(errors.join('\n'));process.exit(1)}
          })();
          NODE

      - name: Refuse stale production deployment
        run: |
          git fetch origin main --quiet
          test "$(git rev-parse origin/main)" = "$GITHUB_SHA"

      - name: Create deployment fingerprint
        run: printf '%s\n' "$GITHUB_SHA" > public/__build-sha.txt

      - name: Deploy Worker
        uses: cloudflare/wrangler-action@953926a2e2182532811c01a25e53647d93bf07c0 # v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy --config wrangler.jsonc

      - name: Verify production fingerprint
        run: |
          set -euo pipefail
          expected="$GITHUB_SHA"
          actual=""
          for attempt in $(seq 1 30); do
            actual="$(curl -fsSL --retry 2 --retry-delay 1 https://simulateur.site/__build-sha.txt 2>/dev/null || true)"
            if [ "$actual" = "$expected" ]; then
              echo "Production fingerprint verified on attempt $attempt."
              exit 0
            fi
            echo "Production fingerprint not propagated yet (attempt $attempt/30)."
            sleep 2
          done
          echo "Production fingerprint mismatch after 60 seconds."
          echo "Expected: $expected"
          echo "Received: $actual"
          exit 1

      - name: Smoke-test production after deploy
        run: |
          npm install --no-save playwright@1.55.0 >/dev/null 2>&1
          npx playwright install chromium >/dev/null 2>&1
          node <<'NODE'
          const fs = require('fs');
          const { chromium } = require('playwright');

          function walk(dir, out=[]) {
            for (const e of fs.readdirSync(dir,{withFileTypes:true})) {
              const p=dir+'/'+e.name;
              if(e.isDirectory()) walk(p,out);
              else if(e.isFile() && p.endsWith('.html')) out.push(p);
            }
            return out;
          }

          (async()=>{
            const files=walk('public');
            const browser=await chromium.launch({headless:true});
            const errors=[];
            for(const file of files){
              const route='/'+file.slice('public/'.length).replace(/\/index\.html$/,'/');
              const page=await browser.newPage();
          async function populate(page) {
            await page.locator('input').evaluateAll((inputs) => {
              for (const input of inputs) {
                if (input.type === 'date') input.value = '2020-01-15';
                else if (input.type === 'number') input.value = input.min && Number(input.min) > 10 ? input.min : '10';
                else if (input.type !== 'hidden') input.value = 'test';
                input.dispatchEvent(new Event('input', {bubbles:true}));
                input.dispatchEvent(new Event('change', {bubbles:true}));
              }
            });
            await page.locator('select').evaluateAll((selects) => {
              for (const select of selects) {
                if (select.options.length) {
                  select.selectedIndex = 0;
                  select.dispatchEvent(new Event('change', {bubbles:true}));
                }
              }
            });
          }

              const consoleErrors=[];
              const pageErrors=[];
              page.on('console',m=>{if(m.type()==='error' && !/cloudflareinsights|beacon\.min\.js/i.test(m.text())) consoleErrors.push(m.text())});
              page.on('pageerror',e=>pageErrors.push(String(e)));
              try{
                const response=await page.goto('https://simulateur.site'+route,{waitUntil:'domcontentloaded',timeout:20000});
                if(!response || response.status()!==200) errors.push(file+': production HTTP '+(response&&response.status()));
                if(!(await page.title())) errors.push(file+': production empty title');
                if(file.startsWith('public/outil/')){
                  await populate(page);
                  const buttons=page.locator('button');
                  const n=await buttons.count();
                  if(n===0) errors.push(file+': production no button');
                  for(let i=0;i<n;i++){
                    try{await buttons.nth(i).click({timeout:2000}); await page.waitForTimeout(50);}catch(e){errors.push(file+': production button '+i+' click failed: '+e.message)}
                  }
                }
                if(consoleErrors.length) errors.push(file+': production console.error: '+consoleErrors.join(' | '));
                if(pageErrors.length) errors.push(file+': production pageerror: '+pageErrors.join(' | '));
              }catch(e){errors.push(file+': production '+e.message)}
              await page.close();
            }
            await browser.close();
            console.log('Production smoke-tested '+files.length+' public HTML pages, including '+files.filter(f=>f.startsWith('public/outil/')).length+' calculators.');
            if(errors.length){console.error(errors.join('\n'));process.exit(1)}
          })();
          NODE
