name: Deploy Simulateur to Cloudflare

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0

      - name: Pre-production security and architecture gate
        run: node scripts/check-security.mjs

      - name: Verify sitemap is up to date
        run: node scripts/generate-sitemap.mjs --check

      - name: Verify regulatory parameters (generated file, validity, year policy)
        run: |
          node scripts/generate-params.mjs --check
          node scripts/check-params.mjs

      - name: Verify pages contract (structural ratchet)
        run: node scripts/check-pages.mjs --ratchet

      - name: Verify shared layout is normalized
        run: node scripts/normalize-layout.mjs --check

      - name: Verify AdSense HTML is prepared
        run: node scripts/prepare-adsense.mjs --check

      - name: Verify AdSense HTML markers
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const path = require('path');
          const root = 'public';
          const errors = [];
          const { isInteractivePage } = await import('./scripts/interactive-families.mjs');
          function walk(dir, out = []) {
            for (const entry of fs.readdirSync(dir, {withFileTypes:true})) {
              const file = path.join(dir, entry.name);
              if (entry.isDirectory()) {
                if (!(dir === root && ['.well-known','api'].includes(entry.name))) walk(file, out);
              } else if (entry.isFile() && (entry.name === 'index.html' || (dir === root && entry.name === '404.html'))) out.push(file);
            }
            return out;
          }
          for (const file of walk(root)) {
            const html = fs.readFileSync(file, 'utf8');
            const head = (html.match(/<head\b[^>]*>[\s\S]*?<\/head>/i) || [''])[0];
            const meta = (head.match(/<meta\b[^>]*name=["']google-adsense-account["'][^>]*>/gi) || []).length;
            if (meta !== 1) errors.push(file + ': expected exactly one AdSense account meta, found ' + meta);
          }
          console.log('Verified AdSense markers on ' + walk(root).length + ' HTML pages.');
          if (errors.length) { console.error(errors.join('\n')); process.exit(1); }
          NODE

      - name: Check layout consistency
        run: node scripts/check-layout.mjs

      - name: Verify commit and consistency before production
        run: |
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          node <<'NODE'
          const fs = require('fs');
          import cp from 'node:child_process';
          const errors = [];
          const minimumSitemapUrls = 106;
          const critical = [
            ['public/outil/interets-composes/index.html', 8000, ['<svg', '<table', 'Et si']],
            ['public/outil/signe-astrologique/index.html', 8000, ['ascendant', 'Calculs associés']],
            ['public/outil/preavis-demission/index.html', 5000, ['Préavis', 'source']]
          ];
          const sitemap = fs.readFileSync('public/sitemap.xml', 'utf8');
          const urls = [...sitemap.matchAll(/<loc>([^<]+)<\/loc>/g)].map(m => m[1]);
          if (urls.length < minimumSitemapUrls) errors.push(`sitemap regression: ${urls.length} URLs < ${minimumSitemapUrls}`);
          let parentSitemap = '';
          try { parentSitemap = cp.execFileSync('git', ['show', 'HEAD^:public/sitemap.xml'], {encoding:'utf8'}); } catch {}
          if (parentSitemap) {
            const parentCount = (parentSitemap.match(/<loc>/g) || []).length;
            if (urls.length < parentCount) errors.push(`sitemap lost URLs: ${parentCount} -> ${urls.length}`);
          }
          for (const [file, minBytes, markers] of critical) {
            if (!fs.existsSync(file)) { errors.push(`missing critical file: ${file}`); continue; }
            const html = fs.readFileSync(file, 'utf8');
            if (html.length < minBytes) errors.push(`critical page too small: ${file} (${html.length} bytes)`);
            for (const marker of markers) if (!html.toLowerCase().includes(marker.toLowerCase())) errors.push(`critical marker missing in ${file}: ${marker}`);
          }
          const changed = cp.execFileSync('git', ['diff', '--name-only', 'HEAD^', 'HEAD', '--', 'public'], {encoding:'utf8'}).trim().split(/\r?\n/).filter(Boolean);
          for (const file of changed.filter(f => isInteractivePage(f.slice('public/'.length)) && f.endsWith('.html'))) {
            // Deleted public HTML files are intentional changes; there is no current file to inspect.
            if (!fs.existsSync(file)) continue;
            let parent = '';
            try { parent = cp.execFileSync('git', ['show', `HEAD^:${file}`], {encoding:'utf8'}); } catch {}
            const current = fs.readFileSync(file, 'utf8');
            if (parent.length >= 2000 && current.length < parent.length * 0.65) errors.push(`destructive HTML shrink detected: ${file} (${parent.length} -> ${current.length} bytes)`);
          }
          if (errors.length) { console.error(errors.join('\n')); process.exit(1); }
          console.log(`Consistency guard passed: ${urls.length} sitemap URLs; ${changed.length} public files changed.`);
          NODE

      - name: Validate complete static site
        run: |
          node <<'NODE'
          const fs = require('fs');
          const path = require('path');
          const vm = require('vm');

          const root = 'public';
          const files = [];
          const allFiles = new Set();

          function walk(dir) {
            for (const entry of fs.readdirSync(dir, { withFileTypes: true })) {
              const p = path.join(dir, entry.name);
              if (entry.isDirectory()) walk(p);
              else if (entry.isFile()) {
                allFiles.add(p.replaceAll(path.sep, '/'));
                if (p.endsWith('.html')) files.push(p.replaceAll(path.sep, '/'));
              }
            }
          }
          walk(root);

          const errors = [];
          const canonicals = new Map();

          function publicPathForFile(file) {
            const rel = file.slice('public'.length);
            if (rel === '/index.html') return '/';
            if (rel.endsWith('/index.html')) return rel.slice(0, -'index.html'.length);
            return rel;
          }

          function existsPublicPath(urlPath) {
            if (urlPath === '/') return allFiles.has('public/index.html');
            const clean = urlPath.replace(/^\//, '').replace(/\/$/, '');
            if (allFiles.has('public/' + clean)) return true;
            if (allFiles.has('public/' + clean + '/index.html')) return true;
            return false;
          }

          for (const file of files) {
            const html = fs.readFileSync(file, 'utf8');
            const route = publicPathForFile(file);

            if (html.includes('--- TRUNCATED ---')) errors.push(file + ': truncation marker');
            if (!/^<!doctype html>/i.test(html.trim())) errors.push(file + ': missing doctype');
            if (!/<html\b[^>]*>/i.test(html)) errors.push(file + ': missing html element');
            if (!/<head\b[^>]*>/i.test(html)) errors.push(file + ': missing head');
            if (!/<body\b[^>]*>/i.test(html)) errors.push(file + ': missing body');
            if (!/<\/html>/i.test(html)) errors.push(file + ': missing closing html tag');

            const head = (html.match(/<head\b[^>]*>[\s\S]*?<\/head>/i) || [''])[0];
            const titles = [...head.matchAll(/<title>[^<]+<\/title>/gi)];
            if (titles.length !== 1) errors.push(file + ': expected exactly one document title, found ' + titles.length);

            const canonicalMatches = [...html.matchAll(/<link[^>]+rel=["']canonical["'][^>]+href=["']([^"']+)["']/gi)];
            if (file === 'public/404.html') {
              if (canonicalMatches.length > 1) errors.push(file + ': more than one canonical');
            } else if (canonicalMatches.length !== 1) {
              errors.push(file + ': expected exactly one canonical, found ' + canonicalMatches.length);
            } else {
              const canonical = canonicalMatches[0][1];
              if (!canonical.startsWith('https://simulateur.site/')) errors.push(file + ': canonical outside simulateur.site: ' + canonical);
              if (canonicals.has(canonical)) errors.push(file + ': duplicate canonical ' + canonical + ' (also ' + canonicals.get(canonical) + ')');
              canonicals.set(canonical, file);
            }

            if (html.toLowerCase().includes('repere')) errors.push(file + ': obsolete brand string "repere"');
            if (html.includes('repere.workers.dev')) errors.push(file + ': obsolete workers.dev domain');

            if (isInteractivePage(file.slice('public/'.length))) {
              if (html.length < 1000) errors.push(file + ': interactive page suspiciously small (' + html.length + ' bytes)');
              if (!/<script\b/i.test(html)) errors.push(file + ': interactive page has no JavaScript');
              if (!/<button\b/i.test(html)) errors.push(file + ': interactive page has no button');
            }

            for (const match of html.matchAll(/<script([^>]*)>([\s\S]*?)<\/script>/gi)) {
              const attrs = match[1];
              const typeMatch = attrs.match(/\btype=["']([^"']+)["']/i);
              const type = typeMatch ? typeMatch[1].toLowerCase() : "";
              if (type && !["text/javascript", "application/javascript", "application/ecmascript", "text/ecmascript", "module"].includes(type)) continue;
              const js = match[2].trim();
              if (!js) continue;
              try { new vm.Script(js, {filename:file}); }
              catch (e) { errors.push(file + ': JavaScript syntax error: ' + e.message); }
            }

            for (const match of html.matchAll(/(?:href|src)=["']([^"']+)["']/gi)) {
              const target = match[1];
              if (!target || target.startsWith('#') || /^(https?:|mailto:|tel:|data:|javascript:)/i.test(target)) continue;
              const targetPath = target.split(/[?#]/)[0];
              if (targetPath.startsWith('/') && !existsPublicPath(targetPath)) {
                errors.push(file + ': broken internal path ' + targetPath);
              }
            }
          }

          if (allFiles.has('public/sitemap.xml')) {
            const sitemap = fs.readFileSync('public/sitemap.xml', 'utf8');
            const sitemapUrls = [...sitemap.matchAll(/<loc>([^<]+)<\/loc>/g)].map(m => m[1]);
            const seen = new Set();
            for (const url of sitemapUrls) {
              if (seen.has(url)) errors.push('public/sitemap.xml: duplicate URL ' + url);
              seen.add(url);
              if (!url.startsWith('https://simulateur.site/')) errors.push('public/sitemap.xml: URL outside canonical domain ' + url);
              else if (!existsPublicPath(new URL(url).pathname)) errors.push('public/sitemap.xml: broken URL ' + url);
            }
            if (sitemapUrls.includes('https://simulateur.site/404.html')) errors.push('public/sitemap.xml: 404 page must not be indexed');
          }

          if (!allFiles.has('public/styles.css')) errors.push('public/styles.css: missing');
          if (!allFiles.has('public/robots.txt')) errors.push('public/robots.txt: missing');
          if (!allFiles.has('public/sitemap.xml')) errors.push('public/sitemap.xml: missing');
          if (allFiles.has('public/simulateurs.js')) {
            try { new vm.Script(fs.readFileSync('public/simulateurs.js','utf8'), {filename:'public/simulateurs.js'}); }
            catch (e) { errors.push('public/simulateurs.js: JavaScript syntax error: ' + e.message); }
          }

          const interactiveCount = files.filter(f => isInteractivePage(f.slice('public/'.length))).length;
          console.log('Validated ' + files.length + ' HTML pages and ' + interactiveCount + ' interactive pages.');

          if (errors.length) {
            console.error(errors.join('\n'));
            process.exit(1);
          }
          NODE

      - name: Run deterministic calculator tests
        run: |
          node tests/ifi.test.js
          node tests/impot.test.js
          node tests/rsa.test.js
          node tests/retraite.test.js
          node tests/simulateurs.test.js
          node tests/params.test.mjs

      - name: Smoke-test every calculator in Chromium
        run: |
          npm init -y >/dev/null 2>&1
          npm install --no-save playwright@1.55.0 >/dev/null 2>&1
          npx playwright install chromium >/dev/null 2>&1
          node scripts/smoke-site.mjs --base-url http://127.0.0.1:4173 --mode local

      - name: Refuse stale production deployment
        run: |
          git fetch origin main --quiet
          test "$(git rev-parse origin/main)" = "$GITHUB_SHA"

      - name: Record current production version for rollback
        id: current-production
        uses: cloudflare/wrangler-action@953926a2e2182532811c01a25e53647d93bf07c0 # v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deployments list --json

      - name: Save current production version ID
        env:
          DEPLOYMENTS_JSON: ${{ steps.current-production.outputs.command-output }}
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('fs');
          const raw = process.env.DEPLOYMENTS_JSON;
          if (!raw) throw new Error('Cloudflare deployments list returned no output.');
          let data;
          try { data = JSON.parse(raw); } catch (error) {
            throw new Error('Unable to parse Cloudflare deployments JSON: ' + error.message);
          }
          const deployments = Array.isArray(data) ? data : (data.result?.deployments ?? data.deployments);
          if (!Array.isArray(deployments) || !deployments.length) {
            throw new Error('Cloudflare returned no production deployments.');
          }
          const versions = deployments[0]?.versions;
          const active = Array.isArray(versions) ? versions.find(v => v.percentage === 100) : null;
          const versionId = active?.version_id;
          if (!versionId) throw new Error('Unable to identify the active 100% production version.');
          fs.writeFileSync('/tmp/simulateur-previous-version-id', versionId + '\n');
          fs.appendFileSync(process.env.GITHUB_ENV, 'PREVIOUS_VERSION_ID=' + versionId + '\n');
          console.log('Recorded previous production version for rollback: ' + versionId);
          NODE

      - name: Create deployment fingerprint
        run: printf '%s\n' "$GITHUB_SHA" > public/__build-sha.txt

      - name: Deploy Worker
        id: deploy
        uses: cloudflare/wrangler-action@953926a2e2182532811c01a25e53647d93bf07c0 # v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy --config wrangler.jsonc

      - name: Verify production fingerprint
        run: |
          set -euo pipefail
          expected="$GITHUB_SHA"
          actual=""
          for attempt in $(seq 1 30); do
            actual="$(curl -fsSL --retry 2 --retry-delay 1 https://simulateur.site/__build-sha.txt 2>/dev/null || true)"
            if [ "$actual" = "$expected" ]; then
              echo "Production fingerprint verified on attempt $attempt."
              exit 0
            fi
            echo "Production fingerprint not propagated yet (attempt $attempt/30)."
            sleep 2
          done
          echo "Production fingerprint mismatch after 60 seconds."
          echo "Expected: $expected"
          echo "Received: $actual"
          exit 1

      - name: Verify production AdSense integration
        run: |
          node <<'NODE'
          const https = require('https');
          function get(url) {
            return new Promise((resolve, reject) => {
              https.get(url, response => {
                let body = '';
                response.setEncoding('utf8');
                response.on('data', chunk => body += chunk);
                response.on('end', () => resolve({status: response.statusCode, headers: response.headers, body}));
              }).on('error', reject);
            });
          }
          (async () => {
            const page = await get('https://simulateur.site/');
            if (page.status !== 200) throw new Error('Homepage HTTP ' + page.status);
            const head = (page.body.match(/<head\b[^>]*>[\s\S]*?<\/head>/i) || [''])[0];
            const meta = (head.match(/<meta\b[^>]*name=["']google-adsense-account["'][^>]*>/gi) || []).length;
            if (meta !== 1) throw new Error('Homepage AdSense meta invalid: meta=' + meta);
            console.log('Production homepage AdSense markers verified.');
          })().catch(error => { console.error(error.message); process.exit(1); });
          NODE

      - name: Verify production ads.txt
        run: |
          set -euo pipefail
          status="$(curl -fsSL -o /tmp/ads-body.txt -w '%{http_code}' https://simulateur.site/ads.txt)"
          test "$status" = "200"
          content_type="$(curl -fsSI https://simulateur.site/ads.txt | awk -F': ' 'BEGIN{IGNORECASE=1} /^content-type:/ {print $2}' | tr -d '\r' | tail -n 1)"
          echo "Production ads.txt Content-Type: $content_type"
          printf '%s' "$content_type" | grep -Eiq '^text/plain(;|$)'
          test "$(cat /tmp/ads-body.txt)" = "google.com, pub-2924580037451268, DIRECT, f08c47fec0942fa0"
          echo "Production ads.txt verified."

      - name: Check production exchange-rate API (informational)
        continue-on-error: true
        run: |
          node <<'NODE'
          (async () => {
            const res = await fetch('https://simulateur.site/api/devises');
            if (!res.ok) throw new Error('HTTP ' + res.status);
            const d = await res.json();
            if (d.rates?.EUR !== 1 || !Number.isFinite(d.rates?.USD)) throw new Error('unexpected payload');
            console.log('Production /api/devises OK.');
          })().catch(e => { console.log('::warning::Production /api/devises check failed (' + e.message + '); not blocking deployment.'); process.exit(1); });
          NODE

      - name: Smoke-test production after deploy
        run: |
          npm install --no-save playwright@1.55.0 >/dev/null 2>&1
          npx playwright install chromium >/dev/null 2>&1
          node scripts/smoke-site.mjs --base-url https://simulateur.site --mode production

      - name: Roll back failed production deployment
        if: ${{ failure() && steps.deploy.outcome != 'skipped' && env.PREVIOUS_VERSION_ID != '' }}
        uses: cloudflare/wrangler-action@953926a2e2182532811c01a25e53647d93bf07c0 # v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: rollback ${{ env.PREVIOUS_VERSION_ID }} --message "Automatic rollback after failed production verification"
