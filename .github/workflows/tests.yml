name: Tests
on:
  pull_request:
    branches: [main]
  merge_group:
    types: [checks_requested]
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0

      - name: Pre-production security and architecture gate
        run: node scripts/check-security.mjs

      - name: Verify committed build is canonical
        run: |
          node scripts/generate-sitemap.mjs --check
          node scripts/normalize-layout.mjs --check
          node scripts/prepare-adsense.mjs --check

      - name: Test sitemap lastmod validation
        run: node tests/sitemap.test.mjs

      - name: Validation statique complète du site
        run: node scripts/check-static-site.mjs

      - name: Test garde-fou du layout
        run: node tests/check-layout.test.mjs

      - name: Check layout
        run: node scripts/check-layout.mjs

      - name: Test calculateur de droits de donation
        run: node tests/donation.test.mjs

      - name: Test calculateur IFI
        run: node tests/ifi.test.js

      - name: Test calculateur impôt
        run: node tests/impot.test.js

      - name: Test calculateur RSA
        run: node tests/rsa.test.js

      - name: Test calculateur retraite
        run: node tests/retraite.test.js

      - name: Test calculateur âge de retraite
        run: node tests/age-retraite.test.js

      - name: Test SEO âge de retraite
        run: node tests/age-retraite-seo.test.js

      - name: Test final âge de retraite
        run: node tests/age-retraite-final.test.js

      - name: Test garde des résultats
        run: node tests/simulateurs.test.js

      - name: Test calculateur salaire brut net
        run: node tests/salaire-brut-net.test.js

      - name: Test calculateur PTZ
        run: node tests/ptz.test.mjs

      - name: Test filtre publicitaire
        run: node tests/ad-filter.test.mjs

      - name: Test des formes de résultat invalide
        run: node tests/invalid-result.test.mjs

      - name: Préparer Chromium pour le smoke des résultats
        run: |
          npm init -y >/dev/null 2>&1
          npm install --no-save playwright@1.55.0 >/dev/null 2>&1
          npx playwright install chromium >/dev/null 2>&1

      - name: Smoke bloquant des résultats invalides
        run: node tests/smoke-results.test.mjs

      - name: Smoke-test du site de déploiement en local
        run: node scripts/smoke-site.mjs --base-url http://127.0.0.1:4173 --mode local

      - name: Test régression ratio
        run: node tests/ratio.test.mjs

      - name: Tests génériques des calculateurs
        run: node tests/generic-calcs.test.mjs

      - name: Test métier du signe astrologique
        run: node tests/signe-astrologique.test.mjs

      - name: Tests de référence sourcés
        run: node tests/reference-calcs.test.mjs

      - name: Test paramètres réglementaires
        run: node tests/params.test.mjs

      - name: Contrôle des paramètres réglementaires (génération, péremption, année)
        run: |
          node scripts/generate-params.mjs --check
          node scripts/check-params.mjs

      - name: Anticipation des échéances des paramètres (60 jours, non bloquant)
        run: |
          set +e
          output="$(node scripts/check-params.mjs --horizon 60 2>&1)"
          status=$?
          printf '%s\n' "$output"
          if [ "$status" -ne 0 ]; then
            while IFS= read -r line; do
              case "$line" in
                *"ERREUR [horizon]"*) echo "::warning::$line" ;;
              esac
            done <<< "$output"
          fi
          exit 0

      - name: Test check-pages
        run: node tests/check-pages.test.mjs

      - name: Test normalisation du layout
        run: node tests/normalize-layout.test.mjs

      - name: Test classification des pages interactives
        run: node tests/interactive-families.test.mjs

      - name: Test workflow de déploiement
        run: node tests/deploy-workflow.test.mjs

      - name: Contrôle du contrat final des pages modifiées
        if: github.event_name == 'pull_request'
        env:
          CHECK_PAGES_BASE_REF: ${{ github.event.pull_request.base.sha }}
        run: node scripts/check-pages.mjs --check-changed-contract

      - name: Contrôle des pages (cliquet bloquant)
        env:
          CHECK_PAGES_BASE_REF: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha || github.event.before }}
        run: node scripts/check-pages.mjs --ratchet --check-changed-contract
