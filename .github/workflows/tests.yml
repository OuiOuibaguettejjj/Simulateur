name: Tests
on:
  pull_request:
    branches: [main]
  merge_group:
    types: [checks_requested]
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      # Base de comparaison du cliquet et du contrat des pages modifiées (lue par scripts/run-tests.mjs).
      CHECK_PAGES_BASE_REF: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha || github.event.before }}
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0

      # Playwright est épinglé dans package.json (version exacte) : une seule source de vérité, en local comme en CI.
      - name: Installer les dépendances de test
        run: npm install --no-audit --no-fund

      - name: Restaurer le cache de Chromium
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package.json') }}

      - name: Installer Chromium
        run: npx playwright install chromium

      # Toutes les vérifications du dépôt : sécurité, build canonique, tests, navigateur, paramètres, pages, cliquet.
      # Le script exécute chaque étape puis liste tous les échecs ; la liste des étapes est dans scripts/run-tests.mjs.
      # Le même contrôle se lance en local avec : npm test
      - name: Exécuter tous les contrôles (npm test)
        run: npm test
