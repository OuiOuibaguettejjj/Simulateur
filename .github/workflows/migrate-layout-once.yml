name: One-time HTML canonical migration

on:
  push:
    branches: [fix/ci-p0-hardening]
    paths:
      - ".github/workflows/migrate-layout-once.yml"

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0

      - name: Apply the repository's canonical generators
        run: |
          node scripts/normalize-layout.mjs
          node scripts/prepare-adsense.mjs
          git diff --check

      - name: Commit migration and remove one-time workflow
        run: |
          git rm .github/workflows/migrate-layout-once.yml
          if git diff --cached --quiet; then
            echo "No migration changes detected."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public
          git commit -m "chore: synchronize committed HTML with canonical layout"
          git push origin HEAD:fix/ci-p0-hardening
