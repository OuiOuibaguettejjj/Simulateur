name: Validate prerender hardening

on:
  pull_request:
    branches: [main]
    paths:
      - "scripts/prerender-tools.mjs"
      - "public/simulateurs.js"
      - "public/outil/**"
      - ".github/workflows/deploy.yml"
      - ".github/workflows/validate-prerender.yml"
      - "scripts/check-security.mjs"
      - "worker.js"
      - "wrangler.jsonc"
      - "public/_headers"

permissions:
  contents: read

jobs:
  prerender:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Pre-production security and architecture gate
        run: node scripts/check-security.mjs

      - name: Pre-render calculator SEO HTML
        run: node scripts/prerender-tools.mjs

      - name: Verify idempotency
        run: |
          cp -a public /tmp/public-after-first
          node scripts/prerender-tools.mjs
          diff -qr /tmp/public-after-first public

      - name: Verify special pages unchanged
        run: |
          node <<'NODE'
          const fs = require('fs');
          const path = require('path');
          const cp = require('child_process');

          function walk(dir) {
            const files = [];
            for (const entry of fs.readdirSync(dir, {withFileTypes:true})) {
              const p = path.join(dir, entry.name);
              if (entry.isDirectory()) files.push(...walk(p));
              else if (entry.isFile() && entry.name === 'index.html') files.push(p);
            }
            return files;
          }

          const special = walk('public/outil').filter(file => {
            const html = fs.readFileSync(file, 'utf8');
            return !/window\.TOOL\s*=/.test(html) || /<meta\s+name=["']calculator-rendering["']\s+content=["']static["']/i.test(html);
          });

          for (const file of special) {
            const base = cp.execFileSync('git', ['show', 'HEAD:' + file], {encoding:'utf8'});
            const current = fs.readFileSync(file, 'utf8');
            if (base !== current) throw new Error('special page modified: ' + file);
          }

          console.log('Verified ' + special.length + ' static-special pages unchanged.');
          NODE

      - name: Verify prerendered SEO HTML
        run: |
          node <<'NODE'
          const fs = require('fs');
          const path = require('path');
          const errors = [];
          let checked = 0;
          const sim = fs.readFileSync('public/simulateurs.js', 'utf8');
          const metaMatch = sim.match(/const TOOLS_META=([\s\S]*?);\s*function toolMeta/);
          if (!metaMatch) throw new Error('TOOLS_META missing');
          const toolsMeta = Function('return (' + metaMatch[1] + ')')();

          function walk(dir) {
            const files = [];
            for (const entry of fs.readdirSync(dir, {withFileTypes:true})) {
              const p = path.join(dir, entry.name);
              if (entry.isDirectory()) files.push(...walk(p));
              else if (entry.isFile() && entry.name === 'index.html') files.push(p);
            }
            return files;
          }

          for (const file of walk('public/outil')) {
            const html = fs.readFileSync(file, 'utf8');
            if (!/window\.TOOL\s*=/.test(html) || /<meta\s+name=["']calculator-rendering["']\s+content=["']static["']/i.test(html)) continue;
            checked++;

            const h1 = html.match(/<h1\b[^>]*\bid=["']title["'][^>]*>([\s\S]*?)<\/h1>/i);
            if (!h1 || !h1[1].replace(/<[^>]+>/g, '').trim()) errors.push(file + ': empty #title H1');

            const source = html.match(/<p\b[^>]*\bid=["']source["'][^>]*>([\s\S]*?)<\/p>/i);
            if (!source || !source[1].replace(/<[^>]+>/g, '').trim()) errors.push(file + ': empty #source');

            const fields = html.match(/<div\b[^>]*\bid=["']fields["']([^>]*)>([\s\S]*?)<\/div>/i);
            if (!fields) errors.push(file + ': missing #fields');
            else if (!/\bhidden(?:\s*=|\b)/i.test(fields[1]) && !/<(?:input|select|textarea|button)\b/i.test(fields[2])) errors.push(file + ': empty #fields');

            const jsonLd = [...html.matchAll(/<script\b[^>]*type=["']application\/ld\+json["'][^>]*>([\s\S]*?)<\/script>/gi)].map(m => m[1]);
            const breadcrumbCount = jsonLd.filter(s => /"@type"\s*:\s*"BreadcrumbList"/.test(s)).length;
            const webApplicationCount = jsonLd.filter(s => /"@type"\s*:\s*"WebApplication"/.test(s)).length;
            if (breadcrumbCount !== 1) errors.push(file + ': expected exactly one BreadcrumbList, found ' + breadcrumbCount);
            if (webApplicationCount !== 1) errors.push(file + ': expected exactly one WebApplication, found ' + webApplicationCount);

            const titleCount = [...html.matchAll(/<title\b[^>]*>[\s\S]*?<\/title>/gi)].length;
            if (titleCount !== 1) errors.push(file + ': expected exactly one title, found ' + titleCount);

            const breadcrumb = html.match(/<div\b[^>]*class=["']breadcrumb["'][^>]*>([\s\S]*?)<\/div>/i);
            if (!breadcrumb || !/<a\b[^>]*href=["']\/["'][^>]*>\s*Accueil\s*<\/a>/i.test(breadcrumb[1])) {
              errors.push(file + ': visible breadcrumb missing Accueil link');
            }

            const slug = path.basename(path.dirname(file));
            if (toolsMeta[slug]?.relatedTools?.length) {
              const related = html.match(/<section\b[^>]*class=["']related-tools["'][^>]*>([\s\S]*?)<\/section>/i);
              if (!related) errors.push(file + ': missing static related-tools');
            }
          }

          for (const file of walk('public/outil')) {
            const html = fs.readFileSync(file, 'utf8');
            const isStatic = /<meta\s+name=["']calculator-rendering["']\s+content=["']static["']/i.test(html);
            if (/window\.TOOL\s*=/.test(html) && !isStatic) continue;

            if (isStatic) {
              const h1 = html.match(/<h1\\b[^>]*>([\\s\\S]*?)<\\/h1>/i);
              if (!h1 || !h1[1].replace(/<[^>]+>/g, '').trim()) errors.push(file + ': static page missing non-empty H1');
              const canonicalMatches = [...html.matchAll(/<link[^>]+rel=["']canonical["'][^>]+href=["']([^"']+)["']/gi)];
              if (canonicalMatches.length !== 1) errors.push(file + ': static page must have exactly one canonical');
              const breadcrumb = html.match(/<div\\b[^>]*class=["']breadcrumb["'][^>]*>([\\s\\S]*?)<\\/div>/i);
              if (!breadcrumb || !/<a\\b[^>]*href=["']\\/["'][^>]*>\\s*Accueil\\s*<\\/a>/i.test(breadcrumb[1])) errors.push(file + ': static page visible breadcrumb missing Accueil link');
            }

            const jsonLd = [...html.matchAll(/<script\b[^>]*type=["']application\/ld\+json["'][^>]*>([\s\S]*?)<\/script>/gi)].map(m => m[1]);
            for (const raw of jsonLd) {
              let data;
              try { data = JSON.parse(raw); } catch (e) { errors.push(file + ': invalid JSON-LD: ' + e.message); continue; }
              if (!data || data['@type'] !== 'BreadcrumbList') continue;
              const canonicalMatches = [...html.matchAll(/<link[^>]+rel=["']canonical["'][^>]+href=["']([^"']+)["']/gi)];
              const canonical = canonicalMatches.length === 1 ? canonicalMatches[0][1] : null;
              const items = Array.isArray(data.itemListElement) ? data.itemListElement : [];
              const positions = items.map(x => x && x.position);
              if (!positions.every((p, i) => p === i + 1)) errors.push(file + ': BreadcrumbList positions must be consecutive 1..n');
              const names = items.map(x => x && x.name);
              const urls = items.map(x => x && x.item);
              if (new Set(names).size !== names.length) errors.push(file + ': BreadcrumbList contains duplicate names');
              if (new Set(urls).size !== urls.length) errors.push(file + ': BreadcrumbList contains duplicate URLs');
              if (!items[0] || items[0].name !== 'Accueil') errors.push(file + ': BreadcrumbList first item must be Accueil');
              if (canonical && (!items.length || items[items.length - 1].item !== canonical)) errors.push(file + ': BreadcrumbList last URL differs from canonical');
            }
          }

          console.log('Prerender SEO guard checked ' + checked + ' calculator pages.');
          if (errors.length) {
            console.error(errors.join('\n'));
            process.exit(1);
          }
          NODE

      - name: Verify JavaScript syntax
        run: node --check public/simulateurs.js
